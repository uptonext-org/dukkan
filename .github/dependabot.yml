# B-29: weekly dependency updates and security alerts for every ecosystem in the repository.
# Versions are pinned exactly (see VERSIONS.md files), so every bump arrives as a reviewable PR
# that runs the full CI, including the native builds when apps/mobile changes.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /services/backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      spring: { patterns: ["org.springframework*"] }
      test: { patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "com.tngtech.archunit*"] }
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      react-native: { patterns: ["react-native", "@react-native/*", "@react-native-community/cli*"] }
      react-navigation: { patterns: ["@react-navigation/*"] }
    # Majors the React Native 0.88 toolchain does not support yet (its Babel preset and Jest 29
    # need Babel 7); TypeScript stays on the 6.x line of the agreed stack. Minor and patch updates,
    # including security fixes, still arrive.
    ignore:
      - { dependency-name: "@babel/*", update-types: ["version-update:semver-major"] }
      - { dependency-name: "jest", update-types: ["version-update:semver-major"] }
      - { dependency-name: "babel-jest", update-types: ["version-update:semver-major"] }
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      vite: { patterns: ["vite", "vitest", "@vitejs/*"] }
      testing-library: { patterns: ["@testing-library/*"] }
    # typescript-eslint supports TypeScript < 6.1 only, and the stack is pinned to the 6.x line.
    ignore:
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /apps/customer-web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      vite: { patterns: ["vite", "vitest"] }
    # Same TypeScript line as the app; react-native-web and react-dom follow apps/mobile's React.
    ignore:
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
  - package-ecosystem: docker
    directory: /apps/customer-web
    schedule: { interval: monthly }
    # The build stage follows the Node LTS line of .nvmrc and CI; majors come together with it.
    ignore:
      - { dependency-name: "node", update-types: ["version-update:semver-major"] }
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: monthly }
    # The build stage follows the Node LTS line of .nvmrc and CI; majors come together with it.
    ignore:
      - { dependency-name: "node", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /tools/web-preview
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: bundler
    directory: /apps/mobile
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /services/backend
    schedule: { interval: monthly }
    # The stack is pinned to Java 25 (LTS); the build toolchain requires it.
    ignore:
      - { dependency-name: "eclipse-temurin", update-types: ["version-update:semver-major"] }
