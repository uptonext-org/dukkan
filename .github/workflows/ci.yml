name: CI

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: OpenAPI contract lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y @redocly/cli@2.64.1 lint packages/shared-contracts/openapi.yaml

  backend:
    name: Backend build, static analysis and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.4"
      - uses: gradle/actions/setup-gradle@v6
      # Compiles with Error Prone, runs unit, integration (Testcontainers/PostgreSQL 18.6),
      # architecture and contract tests. Docker is available on GitHub-hosted Ubuntu runners.
      - run: ./gradlew build --no-daemon
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: services/backend/build/reports/tests/
      - run: docker build -t dukkan-backend:ci .

  mobile:
    name: Mobile typecheck, lint, tests and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      # Release JS bundles for both platforms, compiled to Hermes bytecode (what the native builds embed).
      - run: npm run bundle:check
      # Blocks on critical advisories. Known high: braces <=3.0.3 via metro/CLI tooling, no fix published (docs/setup.md).
      - run: npm audit --omit=dev --audit-level=critical

  web:
    name: Web portal typecheck, lint, tests, build and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  customer-web:
    name: Customer web app typecheck, lint, tests, build and audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/customer-web/package-lock.json
      # The app code and its libraries come from apps/mobile.
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: npm ci
        working-directory: apps/customer-web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - working-directory: apps/customer-web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

  images:
    name: Web images build and serve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/customer-web/Dockerfile -t dukkan-customer-web:ci .
      - run: docker build -t dukkan-portal:ci apps/web
      - name: Serve the customer app with a read-only root file system and check routes and headers
        run: |
          docker run -d --name web --read-only --tmpfs /tmp \
            -e DUKKAN_MAP_TILE_URL='https://tiles.example/{z}/{x}/{y}.png' -p 8090:8080 dukkan-customer-web:ci
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && break; sleep 1; done
          curl -sf localhost:8090/markets/abc/products/def | grep -q '<div id="root">'
          curl -sf localhost:8090/config.js | grep -q 'tiles.example'
          curl -sfI localhost:8090/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/api/v1/markets)" = 404
          docker run -d --name portal --read-only --tmpfs /tmp -p 8091:8080 dukkan-portal:ci
          for i in $(seq 1 30); do curl -sf localhost:8091/healthz && break; sleep 1; done
          curl -sf localhost:8091/orders | grep -q '<div id="root">'
          curl -sfI localhost:8090/manifest.webmanifest | grep -qi 'content-type: application/manifest+json'
      - if: failure()
        run: docker logs web; docker logs portal

  backup-drill:
    name: Backup and restore drill (production scripts)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infrastructure/production
    steps:
      - uses: actions/checkout@v7
      - name: Lint the scripts
        run: shellcheck -s sh backup.sh offsite-backup.sh restore.sh
      - name: Dump, restore test, encrypted offsite snapshot, restore from it
        run: |
          set -eu
          curl -sSL https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 | bunzip2 > "$RUNNER_TEMP/restic"
          chmod +x "$RUNNER_TEMP/restic"
          docker network create drill
          docker run -d --name postgres --network drill -e POSTGRES_DB=dukkan -e POSTGRES_USER=dukkan -e POSTGRES_PASSWORD=drill postgres:18.6
          until docker exec postgres pg_isready -U dukkan -d dukkan; do sleep 1; done
          docker exec postgres psql -U dukkan -d dukkan -c "create table app_user(id int); insert into app_user select generate_series(1, 42); create table market(id int); create table customer_order(id int); create table flyway_schema_history(version text); insert into flyway_schema_history values ('18');"
          pg="-e PGHOST=postgres -e PGUSER=dukkan -e PGPASSWORD=drill -e PGDATABASE=dukkan"
          docker volume create backups
          docker run --rm --network drill $pg -e RESTORE_TEST_WEEKDAY="$(date +%u)" -v "$PWD/backup.sh:/b.sh:ro" -v backups:/backups postgres:18.6 \
            sh -c 'timeout 60 sh /b.sh --now || true' | tee backup.log
          grep -q "restore test ok: 42 accounts" backup.log
          mkdir -p "$RUNNER_TEMP/repo" "$RUNNER_TEMP/media" "$RUNNER_TEMP/erasures"
          echo photo > "$RUNNER_TEMP/media/a.jpg"
          docker run --rm -e RESTIC_REPOSITORY=/repo -e RESTIC_PASSWORD=drill-key -e RESTORE_TEST_WEEKDAY="$(date +%u)" \
            -v "$RUNNER_TEMP/restic:/usr/bin/restic:ro" -v "$PWD/offsite-backup.sh:/o.sh:ro" -v backups:/backups \
            -v "$RUNNER_TEMP/media:/data/media" -v "$RUNNER_TEMP/erasures:/data/erasures" -v "$RUNNER_TEMP/repo:/repo" alpine:3.20 \
            sh -c 'timeout 60 sh /o.sh --now || true' | tee offsite.log
          grep -q "offsite ok" offsite.log
          grep -q "no errors were found" offsite.log
          # The repository holds no readable copy of the data.
          if grep -rq "photo" "$RUNNER_TEMP/repo"; then echo "plaintext found in the repository"; exit 1; fi
          # Restore the snapshot into a fresh database.
          docker exec postgres psql -U dukkan -d postgres -c "create database drill_restore"
          docker run --rm -e RESTIC_REPOSITORY=/repo -e RESTIC_PASSWORD=drill-key -v "$RUNNER_TEMP/restic:/usr/bin/restic:ro" \
            -v "$RUNNER_TEMP/repo:/repo" -v "$RUNNER_TEMP/out:/out" alpine:3.20 restic restore latest --target /out
          docker run --rm --network drill $pg -v "$RUNNER_TEMP/out:/out:ro" postgres:18.6 pg_restore --no-owner -d drill_restore /out/backups/latest.dump
          test "$(docker exec postgres psql -U dukkan -d drill_restore -tAc 'select count(*) from app_user')" = 42
          test -f "$RUNNER_TEMP/out/data/media/a.jpg"

  e2e-api:
    name: End-to-end API (app client against the real backend)
    runs-on: ubuntu-24.04
    needs: [backend, mobile]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: dukkan
          POSTGRES_USER: dukkan
          POSTGRES_PASSWORD: dukkan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dukkan -d dukkan" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.4"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/customer-web/package-lock.json
      - name: Build and start the backend (local profile with seed data and demo accounts)
        working-directory: services/backend
        run: |
          ./gradlew bootJar --no-daemon
          nohup java -jar build/libs/dukkan-backend.jar --spring.profiles.active=local > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Run the app's live API and system tests
        working-directory: apps/mobile
        env:
          DUKKAN_LIVE_API_URL: http://localhost:8080/api/v1
        run: |
          npm ci
          npx jest --ci live.api system.api
      - name: Run the web app's browser smoke test (Chromium)
        working-directory: apps/customer-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run smoke
      - if: failure()
        run: tail -n 200 services/backend/backend.log

  kubernetes:
    name: Kubernetes manifests render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: kubectl kustomize infrastructure/kubernetes > /dev/null
