name: Dependency graph

# B-29: submits the resolved Gradle dependency graph (including transitive dependencies) to
# GitHub, so Dependabot security alerts cover the backend as well as the npm lockfiles, which
# GitHub reads by itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradle:
    name: Submit Gradle dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.4"
      - uses: gradle/actions/dependency-submission@v5
        with:
          build-root-directory: services/backend
