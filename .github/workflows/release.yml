name: Release

# Builds and publishes the images for a version tag (v1.0.0 → ghcr.io/<owner>/dukkan-*:1.0.0):
#   git tag v1.0.0 && git push origin v1.0.0
# Production then runs that version (infrastructure/production, DUKKAN_VERSION).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 1.0.0-rc.1)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build, test and publish images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.4"
      - uses: gradle/actions/setup-gradle@v6
      - name: Version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # The image skips the tests; a release runs them first.
      - name: Backend tests
        working-directory: services/backend
        run: ./gradlew build --no-daemon
      - name: Build images
        env:
          PREFIX: ${{ steps.version.outputs.prefix }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          label="--label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} --label org.opencontainers.image.revision=${GITHUB_SHA} --label org.opencontainers.image.version=${VERSION}"
          docker build $label -t "$PREFIX/dukkan-backend:$VERSION" services/backend
          docker build $label -t "$PREFIX/dukkan-web:$VERSION" -f apps/customer-web/Dockerfile .
          docker build $label -t "$PREFIX/dukkan-portal:$VERSION" apps/web
      - name: Publish
        env:
          PREFIX: ${{ steps.version.outputs.prefix }}
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for image in dukkan-backend dukkan-web dukkan-portal; do
            docker push "$PREFIX/$image:$VERSION"
          done
          {
            echo "### Published $VERSION"
            for image in dukkan-backend dukkan-web dukkan-portal; do
              echo "- \`$PREFIX/$image:$VERSION\` $(docker inspect --format '{{index .RepoDigests 0}}' "$PREFIX/$image:$VERSION" | cut -d@ -f2)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
