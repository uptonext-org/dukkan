<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Dukkan: Lebensmittel aus Märkten in deiner Nähe – bestellen, abholen oder liefern lassen." />
    <meta name="theme-color" content="#3F7A24" />
    <title>Dukkan</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #f1f1ee; }
      @media (prefers-color-scheme: dark) { body { background: #000000; } }
      /* Phone-width column on wide screens (FRAME_MAX_WIDTH in src/shims/react-native.ts). */
      #root { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; position: relative; overflow: hidden; }
      @media (min-width: 560px) { #root { box-shadow: 0 0 24px rgba(0, 0, 0, 0.12); } }
      /* Yoga lets a flex:1 TextInput shrink to its available width; CSS gives inputs an intrinsic min width. */
      input, textarea { min-width: 0; }
      /* Map pins (src/shims/maps.tsx): Leaflet places the element's corner on the point. */
      .dukkan-pin { background: none; border: 0; overflow: visible; cursor: pointer; }
      .dukkan-pin > * { position: absolute; transform: translate(-50%, -50%); }
      .dukkan-pin:focus { outline: none; }
      .dukkan-pin:focus-visible > * { outline: 3px solid #3f7a24; outline-offset: 2px; border-radius: 999px; }
      noscript { display: block; padding: 24px; font-family: system-ui, sans-serif; }
    </style>
    <script src="/config.js"></script>
  </head>
  <body>
    <noscript>Dukkan braucht JavaScript. / Dukkan needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
