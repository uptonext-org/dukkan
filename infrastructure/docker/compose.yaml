# Local development stack. Start the database only:   docker compose -f infrastructure/docker/compose.yaml up -d postgres
# Start the database and the backend image:            docker compose -f infrastructure/docker/compose.yaml --profile app up --build
# Optional S3-compatible media store (B-32a):          docker compose -f infrastructure/docker/compose.yaml --profile s3 up -d s3
# Optional RabbitMQ for domain events (B-37):           docker compose -f infrastructure/docker/compose.yaml --profile events up -d rabbitmq
name: dukkan

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dukkan
      POSTGRES_USER: dukkan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dukkan}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/; mount the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukkan -d dukkan"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Domain events (ADR 0012). Backend: DUKKAN_EVENTS_TRANSPORT=rabbitmq (URI default amqp://dukkan:dukkan@localhost:5672).
  # Management UI: http://localhost:15672
  rabbitmq:
    profiles: ["events"]
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dukkan
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dukkan}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # No volume: local broker state is disposable; the outbox in PostgreSQL is the source of truth.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Local stand-in for S3/R2 (Adobe S3Mock, Apache-2.0): only for development and tests, not production.
  # Backend: DUKKAN_MEDIA_STORAGE=s3 DUKKAN_MEDIA_S3_ENDPOINT=http://localhost:9090 DUKKAN_MEDIA_S3_BUCKET=dukkan-media
  #          DUKKAN_MEDIA_S3_PATH_STYLE=true DUKKAN_MEDIA_S3_CREATE_BUCKET=true DUKKAN_MEDIA_S3_ACCESS_KEY=dev DUKKAN_MEDIA_S3_SECRET_KEY=dev
  s3:
    profiles: ["s3"]
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3-data:/data

  backend:
    profiles: ["app"]
    build:
      context: ../../services/backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DUKKAN_DB_URL: jdbc:postgresql://postgres:5432/dukkan
      DUKKAN_DB_USER: dukkan
      DUKKAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-dukkan}
      # Required (>= 32 bytes); the backend refuses to start without it. See .env.example.
      DUKKAN_JWT_SECRET: ${DUKKAN_JWT_SECRET:-}
      # Absolute prefix of image URLs returned by uploads; empty = derived from the request host.
      DUKKAN_MEDIA_PUBLIC_BASE_URL: ${DUKKAN_MEDIA_PUBLIC_BASE_URL:-}
      # Optional: Claude for AI product capture (ADR 0011); empty = rule-based parser only.
      DUKKAN_ANTHROPIC_API_KEY: ${DUKKAN_ANTHROPIC_API_KEY:-}
      # filesystem (volume below) or s3; see the s3 service above and docs/setup.md.
      DUKKAN_MEDIA_STORAGE: ${DUKKAN_MEDIA_STORAGE:-filesystem}
      DUKKAN_MEDIA_S3_ENDPOINT: ${DUKKAN_MEDIA_S3_ENDPOINT:-}
      DUKKAN_MEDIA_S3_BUCKET: ${DUKKAN_MEDIA_S3_BUCKET:-}
      DUKKAN_MEDIA_S3_ACCESS_KEY: ${DUKKAN_MEDIA_S3_ACCESS_KEY:-}
      DUKKAN_MEDIA_S3_SECRET_KEY: ${DUKKAN_MEDIA_S3_SECRET_KEY:-}
      DUKKAN_MEDIA_S3_PATH_STYLE: ${DUKKAN_MEDIA_S3_PATH_STYLE:-false}
      # in-process or rabbitmq (start the rabbitmq service with --profile events).
      DUKKAN_EVENTS_TRANSPORT: ${DUKKAN_EVENTS_TRANSPORT:-in-process}
      DUKKAN_RABBITMQ_URI: ${DUKKAN_RABBITMQ_URI:-amqp://dukkan:dukkan@rabbitmq:5672}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Uploaded images (dukkan.media.directory, docker profile). Local stand-in for S3/MinIO (backlog).
      - media:/var/lib/dukkan/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media:
  s3-data:
