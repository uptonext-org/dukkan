# Local development stack. Start the database only:   docker compose -f infrastructure/docker/compose.yaml up -d postgres
# Start the database and the backend image:            docker compose -f infrastructure/docker/compose.yaml --profile app up --build
name: dukkan

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dukkan
      POSTGRES_USER: dukkan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dukkan}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/; mount the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukkan -d dukkan"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build:
      context: ../../services/backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DUKKAN_DB_URL: jdbc:postgresql://postgres:5432/dukkan
      DUKKAN_DB_USER: dukkan
      DUKKAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-dukkan}
      # Required (>= 32 bytes); the backend refuses to start without it. See .env.example.
      DUKKAN_JWT_SECRET: ${DUKKAN_JWT_SECRET:-}
      # Absolute prefix of image URLs returned by uploads; empty = derived from the request host.
      DUKKAN_MEDIA_PUBLIC_BASE_URL: ${DUKKAN_MEDIA_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Uploaded images (dukkan.media.directory, docker profile). Local stand-in for S3/MinIO (backlog).
      - media:/var/lib/dukkan/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media:
