apiVersion: apps/v1
kind: Deployment
metadata:
  name: dukkan-backend
  labels:
    app.kubernetes.io/name: dukkan-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dukkan-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dukkan-backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/uptonext-org/dukkan-backend:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dukkan-backend
            - secretRef:
                name: dukkan-backend
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: media
              mountPath: /var/lib/dukkan/media
      volumes:
        - name: tmp
          emptyDir: {}
        # Uploaded images. NOT production-grade: an emptyDir is per pod and lost on rescheduling, and with
        # 2 replicas each pod only serves what it stored itself. Replace with S3-compatible storage (backlog
        # B-32 follow-up) or a ReadWriteMany PersistentVolumeClaim before real merchants upload photos.
        - name: media
          emptyDir:
            sizeLimit: 2Gi
