# Generated from dashboards/dukkan-backend.json for the Grafana sidecar of kube-prometheus-stack,
# which loads every ConfigMap labelled grafana_dashboard=1. Regenerate with (keeps the label):
#   kubectl create configmap dukkan-grafana-dashboards --from-file=dashboards/ --dry-run=client -o yaml \
#     | kubectl label --local -f - grafana_dashboard=1 -o yaml > grafana-dashboard-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dukkan-grafana-dashboards
  labels:
    grafana_dashboard: "1"
data:
  dukkan-backend.json: |
    {
      "title": "Dukkan Backend",
      "uid": "dukkan-backend",
      "tags": [
        "dukkan"
      ],
      "timezone": "Europe/Berlin",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Bestellungen (24 h)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(dukkan_orders_placed_total{application=\"dukkan-backend\"}[24h])) or vector(0)"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Outbox: ältestes offenes Event",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 300
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(dukkan_outbox_oldest_pending_seconds{application=\"dukkan-backend\"})"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Server-Fehler (5xx, 1 h)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(http_server_requests_seconds_count{application=\"dukkan-backend\",status=~\"5..\"}[1h])) or vector(0)"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "KI-Tokens (24 h)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(dukkan_ai_tokens_total{application=\"dukkan-backend\"}[24h]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Bestellungen pro Stunde",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (fulfilment) (increase(dukkan_orders_placed_total{application=\"dukkan-backend\"}[1h]))",
              "legendFormat": "{{fulfilment}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Statuswechsel pro Stunde",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status, by) (increase(dukkan_orders_status_changes_total{application=\"dukkan-backend\"}[1h]))",
              "legendFormat": "{{status}} ({{by}})"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "API-Latenz (p50 / p95 / p99)",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"dukkan-backend\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"dukkan-backend\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"dukkan-backend\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Anfragen pro Sekunde nach Status",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{application=\"dukkan-backend\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Langsamste Endpunkte (p95)",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(5, histogram_quantile(0.95, sum by (le, method, uri) (rate(http_server_requests_seconds_bucket{application=\"dukkan-backend\"}[5m]))))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Outbox",
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(dukkan_outbox_pending{application=\"dukkan-backend\"})",
              "legendFormat": "offen"
            },
            {
              "refId": "B",
              "expr": "max(dukkan_outbox_retrying{application=\"dukkan-backend\"})",
              "legendFormat": "mit Fehlversuch"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "KI-Aufrufe nach Ergebnis",
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (feature, outcome) (rate(dukkan_ai_requests_seconds_count{application=\"dukkan-backend\"}[15m]))",
              "legendFormat": "{{feature}}: {{outcome}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "KI-Latenz (p95)",
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, feature) (rate(dukkan_ai_requests_seconds_bucket{application=\"dukkan-backend\"}[15m])))",
              "legendFormat": "{{feature}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "JVM-Heap",
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (jvm_memory_used_bytes{application=\"dukkan-backend\",area=\"heap\"})",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (jvm_memory_max_bytes{application=\"dukkan-backend\",area=\"heap\"})",
              "legendFormat": "max {{pod}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Datenbank-Verbindungen",
          "gridPos": {
            "x": 12,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (hikaricp_connections_active{application=\"dukkan-backend\"})",
              "legendFormat": "aktiv {{pod}}"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (hikaricp_connections_pending{application=\"dukkan-backend\"})",
              "legendFormat": "wartend {{pod}}"
            }
          ]
        }
      ]
    }
