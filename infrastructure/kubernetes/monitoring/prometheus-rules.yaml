apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dukkan-backend
  labels:
    app.kubernetes.io/name: dukkan-backend
spec:
  groups:
    - name: dukkan-backend
      rules:
        - alert: DukkanOutboxStuck
          # Merchants are not told about new orders while events stay unpublished.
          expr: max(dukkan_outbox_oldest_pending_seconds) > 300
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: Order events have not been published for more than 5 minutes
            description: Check the publisher log and the RabbitMQ connection (dukkan.events.transport).
        - alert: DukkanOutboxRetrying
          expr: max(dukkan_outbox_retrying) > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: Outbox events keep failing
        - alert: DukkanServerErrors
          expr: sum(rate(http_server_requests_seconds_count{application="dukkan-backend",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="dukkan-backend"}[5m])) > 0.02
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: More than 2% of API requests fail with a server error
        - alert: DukkanSlowRequests
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="dukkan-backend",uri!~".*product-drafts|.*translations"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 95th percentile API latency above 1 s (language-model endpoints excluded)
        - alert: DukkanLanguageModelFailing
          expr: sum(rate(dukkan_ai_requests_seconds_count{outcome="error"}[15m])) / sum(rate(dukkan_ai_requests_seconds_count[15m])) > 0.2
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: More than 20% of language-model calls fail (capture falls back to rules, translation is unavailable)
