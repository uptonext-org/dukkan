openapi: 3.1.0
info:
  title: Dukkan Marketplace API
  version: 0.2.0
  description: |
    Contract-first API for the Dukkan local-market marketplace. This file is the single
    source of truth shared by `services/backend` and `apps/mobile`
    (see `docs/product/marketplace.md` and `README.md` next to this file).

    Conventions:
    - Base path: `/api/v1`. The API is pre-release, so breaking changes are allowed until 1.0.
    - Localisation: clients send `Accept-Language` (`de`, `en`, `ar`, …). Content fields
      (names, descriptions, banner text, category names) are returned in the best matching
      enabled locale with the fallback chain requested → market primary locale → `de`.
      Every localised response carries `Content-Language`. Error `code`s are never
      localised; clients translate them.
    - Money is an integer amount in minor units (cents) plus an ISO 4217 currency.
    - Timestamps are ISO 8601 with offset. Coordinates are WGS84 decimal degrees.
    - Errors use RFC 9457 problem details (`application/problem+json`) with an extra `code`.
    - Authenticated endpoints need `Authorization: Bearer <jwt>`. Browsing is public in
      phase 1 (feature flag `dukkan.features.require-login-to-browse`, default false; when
      it is true, public catalog endpoints answer 401).
    - Checkout and payment are simulated; no payment provider is called.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: meta
  - name: auth
  - name: geo
  - name: markets
  - name: catalog
  - name: search
  - name: favorites
  - name: cart
  - name: shopping-list
    description: Shopping lists by voice, photo or video, matched to a market's products.
  - name: fulfilment
  - name: addresses
  - name: orders
  - name: merchant
  - name: media
    description: Image upload (merchants) and public image delivery.
  - name: notifications
  - name: admin
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- meta
  /locales:
    get:
      tags: [meta]
      operationId: listLocales
      summary: List enabled content locales
      security: []
      responses:
        '200':
          description: Enabled locales in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Locale' }
  /features:
    get:
      tags: [meta]
      operationId: getFeatures
      summary: Functions platform admins switched on (effective state)
      description: |
        A sub-feature (`SHOPPING_LIST_VOICE`, `SHOPPING_LIST_MEDIA`) is only true while
        `SHOPPING_LIST` is. All start switched off.
      security: []
      responses:
        '200':
          description: Feature → on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureSwitches' }
  /platform:
    get:
      tags: [meta]
      operationId: getPlatform
      summary: Legal links, the terms version to accept and how customers pay
      description: |
        Set by the operator (`dukkan.platform.*`). The apps link to the imprint, privacy notice and
        terms, ask new accounts to accept `legal.termsVersion` when it is set, and word the order
        button by `payment`: `ON_SITE` = the customer pays the market at pickup or delivery
        ("zahlungspflichtig bestellen"), `SIMULATED` = no payment (demo).
      security: []
      responses:
        '200':
          description: Platform facts (cacheable for 5 minutes).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Platform' }
  /market-types:
    get:
      tags: [meta]
      operationId: listMarketTypes
      summary: List market types for filter chips
      security: []
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Market types with localised names.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CodeName' }
  /cuisines:
    get:
      tags: [meta]
      operationId: listCuisines
      summary: List cuisines (product origins) for filter chips
      security: []
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Cuisines with localised names.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CodeName' }

  /categories:
    get:
      tags: [meta]
      operationId: listCategories
      summary: The whole category tree (for merchants creating products)
      security: []
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Flat list ordered by sortOrder (productCount is null); build the tree via parentId.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  # ---------------------------------------------------------------- auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a customer or merchant account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`TERMS_NOT_ACCEPTED`: the platform requires accepting its terms (`GET /platform`, `legal.termsVersion`) and `acceptedTermsVersion` is missing or another version.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange a refresh token for new tokens (rotation)
      description: |
        Every refresh token works once. The answer carries a new access token and a new refresh
        token; the old one is spent. Presenting a spent token again ends the whole sign-in (all
        tokens issued from that login), because it means the token was copied. Refresh tokens live
        30 days. 60 refreshes per IP and minute → 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_REFRESH_TOKEN`: unknown, spent, revoked or expired. Sign in again.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the sign-in a refresh token belongs to
      description: Revokes every refresh token of that sign-in. Unknown tokens are ignored. Access tokens stay valid until they expire (15 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Signed out. }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Send a password reset link
      description: |
        Always 202, whether or not an account exists for the email (no enumeration). If it does, a
        link valid for 30 minutes is mailed in the user's language: `dukkan://reset-password?token=…`
        (configurable). 5 requests per IP and hour → 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: Accepted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the token from the reset link
      description: The token works once. Afterwards every sign-in of the account is ended (refresh tokens revoked).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Password changed. }
        '400':
          description: '`VALIDATION_FAILED`; an invalid, used or expired token has `errors[0]` = field `token`, code `INVALID_RESET_TOKEN`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/social:
    post:
      tags: [auth]
      operationId: socialSignIn
      summary: Sign in with Apple or Google (ID token)
      description: |
        The app obtains an OpenID Connect ID token from Sign in with Apple or Google and sends it
        here. The server checks the signature against the provider's keys, the issuer, the audience
        (Dukkan's client IDs) and the expiry, and the nonce when one is sent (equal to the token's
        `nonce` claim or its SHA-256 hex).

        - A known provider account signs in. Otherwise an account with the same **verified** email is
          linked, or a new account is created (names from the request, else from the token;
          `accountType` MERCHANT adds the merchant role).
        - Accounts created this way have no password until "forgot password" sets one.
        - 20 per IP and minute (shared with login) → 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialSignInRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_SOCIAL_TOKEN`: signature, issuer, audience, expiry or nonce wrong.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`SOCIAL_PROVIDER_DISABLED` (no client ID configured), `SOCIAL_EMAIL_MISSING` (new account without a verified email) or `TERMS_NOT_ACCEPTED` (new account, terms required, see register).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the welcome mail
      description: |
        Registration sends a mail with a link to `dukkan://verify-email?token=…` (valid 3 days,
        single use; a new mail adds a link, using one uses all). Apple/Google accounts and accounts
        from before this feature are confirmed already. Invalid, used or expired → 400 with field
        `token`, code `INVALID_VERIFICATION_TOKEN`. With `dukkan.security.auth.require-verified-email`
        the server answers 422 `EMAIL_NOT_VERIFIED` to placing an order or opening a market until the
        address is confirmed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 200 }
      responses:
        '204': { description: Confirmed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/email-verification:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Send the confirmation mail again
      description: Always 202; no mail when the address is already confirmed.
      responses:
        '202': { description: Sent if needed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change my password
      description: Needs the current password. Other sign-ins of the account are ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '400':
          description: '`VALIDATION_FAILED`; a wrong current password has field `currentPassword`, code `Incorrect`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/devices:
    put:
      tags: [notifications]
      operationId: registerDevice
      summary: Register this device for push notifications
      description: The FCM registration token of the app on this device. A token belongs to the account that registered it last.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRequest' }
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [notifications]
      operationId: unregisterDevice
      summary: Stop push notifications to this device (e.g. on logout)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
      responses:
        '204': { description: Removed (or not registered for this account). }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/export:
    get:
      tags: [auth]
      operationId: exportMyData
      summary: Everything stored about the signed-in user, as JSON (GDPR Art. 15 and 20)
      description: Account, linked sign-ins, addresses, orders, favourites, notifications and settings, and the ids of own markets. Sent as a download (`Content-Disposition`), never cached.
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The signed-in user's notification settings
      responses:
        '200':
          description: Settings (push is on until switched off).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Switch push messages on or off
      description: With push off, notifications still appear in the inbox; only the phone's push message is skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: My notification inbox, newest first
      description: |
        Order notifications (B-37), written in the recipient's language when the event happened:
        merchants get `NEW_ORDER` and `ORDER_CANCELLED` (by the customer); customers get
        `ORDER_ACCEPTED`, `ORDER_REJECTED`, `ORDER_READY_FOR_PICKUP`, `ORDER_OUT_FOR_DELIVERY` and
        `ORDER_COMPLETED`, and `ORDER_ADJUSTED` when the market entered missing items (adjustOrderItems).
        The same texts are pushed to registered devices when push is configured.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark all my notifications as read
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      operationId: updateCurrentUser
      summary: Update profile preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- geo
    delete:
      tags: [auth]
      operationId: deleteMyAccount
      summary: Delete the signed-in account (GDPR Art. 17; App Store and Google Play requirement)
      description: |
        Confirm with the current `password`; accounts that only sign in with Apple or Google send no
        password. Removes addresses, carts (releasing slot reservations), favourites, devices,
        notifications and settings, ends every session and anonymises the account. Past orders stay
        for the market's records without the customer's name, street, house number, delivery notes
        and coordinates. The email address can be used for a new account afterwards.
        Access tokens issued before stop working at once: every later request with them answers
        401, also before they expire.

        - Wrong password → 400 `VALIDATION_FAILED` (field `password`, code `Incorrect`); 5 attempts
          per hour → 429.
        - Unfinished orders → 409 `ACCOUNT_HAS_OPEN_ORDERS`; the account runs a market → 409
          `ACCOUNT_OWNS_MARKETS` (support closes or hands over the market first).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, maxLength: 200 }
      responses:
        '204': { description: Deleted. Sign out locally. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /geo/search:
    get:
      tags: [geo]
      operationId: searchPlaces
      summary: Address and place autocomplete
      description: |
        Phase 1 uses a built-in Hamburg gazetteer (districts, postal codes, streets of the seed
        data). The provider sits behind an interface and will be replaced by an external
        geocoding service.
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Matching places, best match first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /geo/reverse:
    get:
      tags: [geo]
      operationId: reverseGeocode
      summary: Nearest known place for coordinates
      security: []
      parameters:
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
      responses:
        '200':
          description: Nearest place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- markets
  /markets:
    get:
      tags: [markets]
      operationId: listMarkets
      summary: Markets near a location
      security: []
      parameters:
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 0.5, maximum: 50, default: 10 } }
        - name: types
          in: query
          description: Comma-separated market type codes.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: cuisines
          in: query
          description: Comma-separated cuisine codes.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - { name: fulfilment, in: query, schema: { $ref: '#/components/schemas/FulfilmentType' } }
        - { name: openNow, in: query, schema: { type: boolean, default: false } }
        - { name: hasOffers, in: query, schema: { type: boolean, default: false } }
        - { name: q, in: query, description: Market name search., schema: { type: string, maxLength: 100 } }
        - name: sort
          in: query
          schema: { type: string, enum: [distance, name, minimum_order, delivery_fee], default: distance }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: A page of markets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /markets/recent:
    get:
      tags: [markets]
      operationId: listRecentMarkets
      summary: My markets — ordered from or visited recently
      description: |
        For the start page view "Meine Märkte". Signed in: the markets the user ordered from
        (orders that were not cancelled or rejected), most recent order first, each with the
        products bought there most recently (available ones, up to 8). Then the markets in
        `visited` (kept by the app, most recently visited first, also for guests) that have no
        orders, without products. Only active markets; unknown ids are skipped. With `lat`/`lng`,
        `distanceMeters` and `deliversToLocation` are set.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: visited
          in: query
          style: form
          explode: false
          schema: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Up to 20 markets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentMarket' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /markets/{marketId}:
    get:
      tags: [markets]
      operationId: getMarket
      summary: Market details
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: lat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Market details. Distance fields are set when lat/lng are given.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/home:
    get:
      tags: [markets]
      operationId: getMarketHome
      summary: Market start page (banners and product sections)
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Composed start page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketHome' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shopping-list:
    get:
      tags: [shopping-list]
      operationId: getShoppingListCapabilities
      summary: Whether shopping lists can be read from photos and videos
      description: |
        `ai` is true when a language model is configured (`DUKKAN_ANTHROPIC_API_KEY`). Without it,
        typed or dictated lists are still read by simple rules; photos and videos are not.
      security: []
      responses:
        '200':
          description: Current capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListCapabilities' }
  /markets/{marketId}/shopping-list:
    post:
      tags: [shopping-list]
      operationId: readShoppingList
      summary: Match a spoken, typed, photographed or filmed shopping list to the market's products
      description: |
        The app transcribes a voice message on the device and sends the text, and/or up to four
        images (photos, or frames of a short video). Each item comes back with the best available
        product and the number of units that covers the amount (`1 kg Tomaten` with a 500 g pack →
        2), plus up to two alternatives. Nothing is stored or added to the cart: the customer
        confirms in the app, which then sets the cart quantities of the chosen lines
        (setCartItemQuantity, on top of what is already in the cart).

        `engine` is `AI` when the language model read the list, `RULES` when simple rules did
        (no model configured, or the model failed; text only). Images without a model, or images
        the model could not read without text → 422 `SHOPPING_LIST_AI_UNAVAILABLE`.
        20 lists per customer and hour → 429 `RATE_LIMITED`. The shopping list switched off by
        platform admins, or images while photo/video is switched off → 422 `FEATURE_DISABLED`.
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 2000, description: 'What the customer said or typed, e.g. "2 Gurken, 1 kg Tomaten".' }
                images:
                  type: array
                  maxItems: 4
                  items: { type: string, format: binary }
                  description: Photos or video frames (JPEG, PNG or WebP, ≤ 5 MB each, ≤ 21 MB in total).
            encoding:
              images:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: The items, in the order given.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /markets/{marketId}/categories:
    get:
      tags: [catalog]
      operationId: listMarketCategories
      summary: Categories that have products in this market
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Flat list ordered by sortOrder; build the tree via parentId.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/products:
    get:
      tags: [catalog, search]
      operationId: listMarketProducts
      summary: Browse and search one market
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: q, in: query, description: 'Matches names and keywords in every locale.', schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: promotedOnly, in: query, schema: { type: boolean, default: false } }
        - { name: newOnly, in: query, schema: { type: boolean, default: false } }
        - { name: organicOnly, in: query, schema: { type: boolean, default: false } }
        - name: bestsellersOnly
          in: query
          description: The market's best sellers (last 30 days, up to 50), most sold first; the other filters and the sort are ignored.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, price_desc, name], default: relevance }
          description: Price sorts use the price paid now (promotionalPrice under a PERCENT_OFF promotion, else price).
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: A page of this market's products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/search/suggestions:
    get:
      tags: [search]
      operationId: marketSearchSuggestions
      summary: Product name suggestions in one market
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Localised product names, best match first.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/promotions:
    get:
      tags: [catalog]
      operationId: listMarketPromotions
      summary: Active promotions of one market
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Active promotions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promotion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/feedback:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    get:
      tags: [markets]
      operationId: getFeedbackAvailability
      summary: Whether customers can write feedback to this market
      security: []
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackAvailability' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [markets]
      operationId: sendFeedback
      summary: Send feedback to the market (signed-in customers)
      description: |
        Only while the merchant takes feedback (else 422 `FEEDBACK_DISABLED`). The merchant sees the
        message, the optional rating and the customer's first name. At most 3 messages per customer
        and market a day (429). Deleted with the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '204': { description: Sent. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products/{productId}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Product details (a market's listing)
      security: []
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Product details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /search/products:
    get:
      tags: [search]
      operationId: searchProductsNearby
      summary: Search products across all markets near a location
      security: []
      parameters:
        - { name: q, in: query, required: true, description: 'Matches names and keywords in every locale.', schema: { type: string, minLength: 2, maxLength: 100 } }
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 0.5, maximum: 50, default: 10 } }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, distance], default: relevance }
          description: price_asc uses the price paid now (promotionalPrice under a PERCENT_OFF promotion, else price).
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Market offers matching the query.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOfferPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- favorites
