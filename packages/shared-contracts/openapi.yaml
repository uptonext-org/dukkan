        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- orders
  /markets/{marketId}/orders:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Simulated checkout of this market's cart
      description: Snapshots prices, address and slot; empties the cart. No payment is taken.
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 64 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '201':
          description: Order placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: The user's orders, newest first
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: One order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{orderId}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel an order (PLACED or ACCEPTED, before the slot cutoff)
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Cancelled order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /orders/{orderId}/reorder:
    post:
      tags: [orders]
      operationId: reorder
      summary: Put the products of a past order into the cart again
      description: |
        Adds every product of the order to the user's cart in the order's market, on top of what
        is already there and at today's prices (any status, also cancelled orders). Each product is
        capped at its per-order maximum (`LIMITED`; a quantity already above a lowered maximum is
        reduced to it). Products that are currently unavailable
        (`UNAVAILABLE`) or no longer sold (`REMOVED`) are skipped, so one sold-out product does not
        block the rest. Load the cart afterwards to show it. 422 `MARKET_NOT_ACTIVE` when the
        market is not taking orders.
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: What went into the cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  # ---------------------------------------------------------------- merchant
  /merchant/markets:
    get:
      tags: [merchant]
      operationId: listMyMarkets
      summary: Markets owned by the signed-in merchant
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Owned markets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MerchantMarket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [merchant]
      operationId: createMyMarket
      summary: Create a market
      description: Status is PENDING_REVIEW, or ACTIVE when `dukkan.features.merchant-auto-approve` is on (default true in phase 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketProfileRequest' }
      responses:
        '201':
          description: Market created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantMarket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /merchant/markets/{marketId}:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    put:
      tags: [merchant]
      operationId: updateMyMarket
      summary: Update the market profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketProfileRequest' }
      responses:
        '200':
          description: Updated market.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantMarket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/feedback:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    get:
      tags: [merchant]
      operationId: listMerchantFeedback
      summary: Customer feedback to the market, newest first, and whether the market takes feedback
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Switch and messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantFeedbackPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/feedback/settings:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    put:
      tags: [merchant]
      operationId: updateFeedbackSettings
      summary: Switch receiving customer feedback on or off (new markets start with off)
      description: Messages already received stay readable when it is switched off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Switch and the first page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantFeedbackPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/order-settings:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    get:
      tags: [merchant]
      operationId: getOrderSettings
      summary: Ordering settings of the market, with the platform defaults for empty fields
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantOrderSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [merchant]
      operationId: updateOrderSettings
      summary: Replace the ordering settings
      description: |
        Customers only see the effect: no order buttons while `ordersEnabled` is false or a pause
        runs (`MarketSummary.acceptsOrders`), a notice for a pause or holiday, and fewer or other
        slots. Booked slots keep their orders when capacity or times change. A pause that already
        ended is dropped; a pause lasts at most 30 days. New markets start with `ordersEnabled: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSettings' }
      responses:
        '200':
          description: Stored settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantOrderSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/catalog:
    get:
      tags: [merchant]
      operationId: searchSharedCatalog
      summary: Search the shared product catalog to add products
      parameters:
