      responses:
        '201':
          description: Listing created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /merchant/markets/{marketId}/listings/import:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    post:
      tags: [merchant]
      operationId: importListings
      summary: Create or update many listings from a CSV file
      description: |
        For the merchant web portal (B-31). Upload with `dryRun=true` first to see what would
        happen, then again without it. **All or nothing:** rows are written only when no row has an
        error; otherwise `applied` is false and every problem is listed per row.

        File: UTF-8 CSV (Excel "CSV UTF-8", a BOM is fine), at most 1 MB and 1000 products. The
        delimiter (`;`, `,` or tab) is detected from the header; fields may be quoted. Columns
        (English or German name, any order, unknown columns are ignored):

        | Column | German | Content |
        |---|---|---|
        | `barcode` | `ean`, `gtin` | 8–14 digits; matches the shared catalog |
        | `name_<locale>` | | e.g. `name_de`, `name_ar`; the market's primary language is required for new products |
        | `description_<locale>` | `beschreibung_<locale>` | |
        | `brand` | `marke` | |
        | `unit_size` | `größe`, `menge` | e.g. `500 g`; required for new products |
        | `category` | `kategorie` | category slug, e.g. `dairy`; required for new products |
        | `price` | `preis` | euros, `4,49` or `4.49` (a `€` is fine); required unless the row updates a listing |
        | `available` | `verfügbar` | `ja`/`nein`, `true`/`false`, `1`/`0` |
        | `max_order_quantity` | `max_menge` | 1–99 |
        | `keywords`, `cuisines`, `allergens` | `stichwörter`, `küche`, `allergene` | separated by a vertical bar |
        | `organic` | `bio` | like `available` |

        Matching per row: the barcode (shared catalog or the market's own products), else the
        market's own product with the same name (primary language) and size. A match the market
        already lists is updated (`UPDATE`: price, availability, max quantity), a match it does not
        list yet becomes a listing (`LIST`), anything else a new private product (`CREATE`; machine
        translation fills the other languages, see translateTexts). Importing the same file twice
        therefore only updates. `line` is the row number in the spreadsheet (header = 1).
        File-level problems → 400 with field `file` and code `Size`, `Encoding`, `Header`, `Empty`
        or `TooManyRows`.
      parameters:
        - { name: dryRun, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The report (also when rows have errors).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/listings/{productId}:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
      - { $ref: '#/components/parameters/ProductId' }
    put:
      tags: [merchant]
      operationId: updateListing
      summary: Change price, availability or limits of a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListingRequest' }
      responses:
        '200':
          description: Updated listing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [merchant]
      operationId: deleteListing
      summary: Remove a listing (soft delete; past orders keep their snapshot)
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/promotions:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    get:
      tags: [merchant]
      operationId: listMyPromotions
      summary: All promotions of my market including expired ones
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Promotions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promotion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [merchant]
      operationId: createPromotion
      summary: Create a promotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionRequest' }
      responses:
        '201':
          description: Promotion created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/promotions/{promotionId}:
    delete:
      tags: [merchant]
      operationId: deletePromotion
      summary: End a promotion now
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
