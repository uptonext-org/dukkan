  /merchant/markets/{marketId}/orders:
    get:
      tags: [merchant]
      operationId: listMarketOrders
      summary: Orders of my market, newest first
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/markets/{marketId}/insights:
    get:
      tags: [merchant]
      operationId: getMarketInsights
      summary: Sales overview of my market
      description: |
        Whole days in Europe/Berlin: the last `days` days including today (`from`–`to`), and the
        same number of days before for comparison (`previous`, which ends at the same time of day as
        now, so a day that is not over yet is compared fairly). Orders count unless they were
        cancelled or rejected; revenue is the order total (after discounts, with delivery fees).
        Only aggregates — nothing identifies a customer. A returning customer had already ordered in
        this market before one of their orders in the period (also earlier in the same period).
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketInsights' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /merchant/orders/{orderId}/status:
    post:
      tags: [merchant]
      operationId: advanceOrderStatus
      summary: Move an order to its next status (simulated fulfilment)
      description: |
        Allowed transitions: PLACED→ACCEPTED|REJECTED; ACCEPTED→READY_FOR_PICKUP (pickup) or
        OUT_FOR_DELIVERY (delivery); READY_FOR_PICKUP|OUT_FOR_DELIVERY→COMPLETED.
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusRequest' }
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /merchant/orders/{orderId}/items:
    put:
      tags: [merchant]
      operationId: adjustOrderItems
      summary: Missing items while packing (units handed over per line)
      description: |
        While an order is PLACED or ACCEPTED, the market sets how many units of a line it can hand
        over (0 = missing; the ordered quantity = as ordered again). Lines not mentioned stay as they
        are. The line is charged the cheaper of its ordered total scaled down to the units handed
        over (rounded down) and those units re-priced with the promotion that applied when ordering
        ("3 for 5 €": 4 ordered, 3 handed over → 5 €). The order totals are recomputed and
        `originalTotal` keeps the total at ordering. In the customer's favour, the delivery fee and
        the minimum order value are not checked again. The customer is notified (`order.items_adjusted`).
        Errors: 400 `VALIDATION_FAILED` (unknown line, quantity above the ordered one, a line twice),
        422 `ORDER_NOT_ADJUSTABLE` (ready, on its way or finished) or `ORDER_ADJUSTMENT_EMPTY`
        (nothing would be left: reject the order instead).
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderItemsRequest' }
      responses:
        '200':
          description: Updated order (merchant view).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /merchant/markets/{marketId}/media:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    post:
      tags: [merchant, media]
      operationId: uploadMedia
      summary: Upload a photo (logo, cover, banner or product) for my market
      description: |
        Stores an image and returns its public, absolute URL. Put the URL into `logoUrl` /
        `coverImageUrl` (MarketProfileRequest), `newProduct.imageUrl` (CreateListingRequest) or
        `imageUrl` (UpdateListingRequest); uploading alone changes nothing else.

        - Accepted formats are detected from the file's **magic bytes** (the part's declared
          content type is ignored): JPEG, PNG and WebP. Anything else (GIF, SVG, HEIC, PDF, …)
          answers 415 `UNSUPPORTED_MEDIA_TYPE`.
        - At most 5 MB (5 × 1024 × 1024 bytes) per file → otherwise 413 `FILE_TOO_LARGE`.
        - JPEG and PNG must decode completely, WebP must have a consistent RIFF/VP8 header →
          otherwise 400 `INVALID_IMAGE`. At most 40 megapixels → otherwise 400 `IMAGE_TOO_LARGE`.
        - Metadata is removed before storing, without re-encoding the image: EXIF (GPS position,
          device, time), XMP, IPTC and comments in JPEG; text, EXIF and time chunks in PNG; EXIF
          and XMP in WebP. Only a JPEG's EXIF orientation is kept, so portrait photos stay upright.
          `sizeBytes` is the stored size.
        - The cleaned file is stored under a content-addressed key (SHA-256 of the bytes plus
          the extension), so uploading the same file again returns the same URL.
        - 60 uploads per user per hour → 429 `RATE_LIMITED` with `Retry-After`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary, description: 'The image (JPEG, PNG or WebP, ≤ 5 MB).' }
                purpose: { $ref: '#/components/schemas/MediaPurpose' }
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Stored (or already stored with the same bytes).
          headers:
            Location:
              description: Same as `url`.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
        '400':
          description: |
            `VALIDATION_FAILED` (missing `file` part, unknown `purpose`), `INVALID_IMAGE` (bytes do
            not decode) or `IMAGE_TOO_LARGE` (more than 40 megapixels).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /merchant/markets/{marketId}/product-drafts:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    post:
      tags: [merchant]
      operationId: createProductDraft
      summary: Turn a short text and/or a product photo into a product draft (AI capture)
      description: |
        Nothing is saved. The merchant reviews the draft and then creates the listing with
        createListing: `catalogProductId` of one of `catalogMatches` (preferred, the shared catalog
        already carries every language), or `newProduct` filled from `product` plus `price`.

        - `text`: what the merchant typed or dictated (keyboard dictation), in any language, e.g.
          `Sucuk Gazi 400 g 4,49 €` or `عدس أحمر ١ كيلو ٢٫٩٩`. `imageKey`: a key returned by
          uploadMedia (purpose PRODUCT), e.g. a photo of the pack. At least one of both.
        - `engine` = `AI` when the configured language model produced the draft. Without a model
          (no API key), or when it fails or declines, the server falls back to its rule-based parser
          (`engine` = `RULES`) and says why in `warnings`. The rule-based parser reads text only.
        - Category, cuisines and allergens are always restricted to the codes the server knows;
          unknown values from the model are dropped (`CATEGORY_UNCERTAIN` when no category is left).
        - The draft is returned in the request's language for `name`, but the model also fills the
          other supported locales; review the translations before saving.
        - 30 drafts per user per hour → 429 `RATE_LIMITED` with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDraftRequest' }
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: The draft (not saved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /merchant/translations:
    post:
      tags: [merchant]
      operationId: translateTexts
      summary: Suggest machine translations for the languages a merchant left empty
      description: |
        Nothing is saved; the merchant reviews the suggestions in the form and saves as usual.

        - Per field, the non-empty values of enabled locales are the source; every other enabled
          locale is translated. Fields that are already complete are left out of the answer, and
          the answer only carries the newly translated locales.
        - `kind` tells the model what the texts are (names stay short, brands and units unchanged).
        - At most 20 fields and 8000 characters per request; field keys must be unique.
        - Private products are also translated automatically after createListing with
          `newProduct`, so shoppers find them in every language (marked as machine translations;
          a merchant's own text is never overwritten).
        - Without a configured language model, or when it fails or declines → 422
          `TRANSLATION_UNAVAILABLE`. 60 requests per user per hour → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslationRequest' }
      responses:
        '200':
          description: Suggestions for the empty locales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranslationResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /media/{key}:
    get:
      tags: [media]
      operationId: getMedia
      summary: Serve an uploaded image
      description: |
        Public (also when `require-login-to-browse` is on) so that image views can load it without
        a token. Keys are content-addressed and never change, so responses carry
        `Cache-Control: public, max-age=31536000, immutable`, plus `ETag`,
        `X-Content-Type-Options: nosniff` and a restrictive `Content-Security-Policy`.

        `w` asks for a smaller copy (B-32d): JPEG and PNG originals wider than `w` are resized
        (aspect ratio kept, EXIF orientation applied, JPEG quality 0.82) once and then served from
        storage, with their own `ETag`. Narrower originals and WebP are served as they are. Clients
        pick the smallest width at least as wide as the image is drawn (times the pixel density).
        With a CDN, forward the query string to the origin.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: SHA-256 of the file (64 lowercase hex characters) plus extension.
          schema: { type: string, pattern: '^[0-9a-f]{64}\.(jpg|png|webp)$', example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b.jpg }
        - name: w
          in: query
          required: false
          description: Width of a smaller copy in pixels; other values → 400.
          schema: { type: integer, enum: [160, 320, 640, 1080] }
      responses:
        '200':
          description: The image bytes as uploaded.
          headers:
            Cache-Control: { schema: { type: string, example: 'public, max-age=31536000, immutable' } }
            ETag: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, example: nosniff } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '304': { description: Not modified (`If-None-Match` matched the ETag). }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- admin
  /admin/features:
    get:
      tags: [admin]
      operationId: adminFeatures
      summary: Feature switches as set (role ADMIN)
      responses:
        '200':
          description: Feature → on, as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureSwitches' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/features/{feature}:
    put:
      tags: [admin]
      operationId: adminSetFeature
      summary: Switch a function on or off for all customers (role ADMIN)
      parameters:
        - { name: feature, in: path, required: true, schema: { type: string, enum: [SHOPPING_LIST, SHOPPING_LIST_VOICE, SHOPPING_LIST_MEDIA, MERCHANT_MULTILINGUAL] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: All switches after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureSwitches' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/markets:
    get:
      tags: [admin]
      operationId: adminListMarkets
      summary: Markets for review (role ADMIN), newest first
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MarketStatus' } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Markets of any (or the given) status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MerchantMarket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/markets/{marketId}/status:
    post:
      tags: [admin]
      operationId: adminSetMarketStatus
      summary: Approve (ACTIVE), suspend (SUSPENDED) or return a market to review
      description: |
        Only ACTIVE markets are visible to customers and accept carts and orders. Approving needs
        complete seller information (`review.complete`), otherwise `MARKET_INCOMPLETE`.
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MarketStatus' }
      responses:
        '200':
          description: Updated market.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantMarket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /admin/catalog/products:
    get:
      tags: [admin]
      operationId: adminCatalogReviewQueue
      summary: Products created by merchants, for review (role ADMIN), oldest first
      description: |
        Every product a merchant creates (createListing with `newProduct`, CSV import) starts as
        `PENDING`. `texts` shows every locale with its source (`machineTranslated` for texts filled by
        machine translation). `duplicates` lists shared products with the same barcode, or the same
        name and size, that may be the same product.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, KEPT_PRIVATE, PROMOTED], default: PENDING } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogReviewPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/catalog/products/{productId}/texts:
    put:
      tags: [admin]
      operationId: adminUpdateCatalogTexts
      summary: Correct or add the name and description of locales (role ADMIN)
      description: Only the given locales change. Corrected texts are no longer marked as machine translations; the search text is rebuilt. An empty description removes it.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid }, description: Catalog product id. }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names: { type: object, additionalProperties: { type: string, minLength: 1, maxLength: 150 } }
                descriptions: { type: object, additionalProperties: { type: string, maxLength: 2000 } }
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogReviewItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/catalog/import:
    post:
      tags: [admin]
      operationId: importCatalog
      summary: Fill the shared catalog from a CSV file (role ADMIN)
      description: |
        For the start catalog before launch (`docs/launch/start-katalog.csv`) and later additions.
        Same file format as importListings, without prices (a `price` column is ignored). Every row
        needs `name_de`, `unit_size` and `category`; other languages are optional. **Dry run by
        default**; send `dryRun=false` to write. All or nothing. Rows already in the shared catalog
        (same barcode, or same German name and pack size) are reported as `EXISTS` and skipped, so a
        file can be imported again. Products go straight into the shared catalog (no review).
      parameters:
        - { name: dryRun, in: query, required: false, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The report (also when rows have errors).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/catalog/products/{productId}/review:
    post:
      tags: [admin]
      operationId: adminReviewCatalogProduct
      summary: Promote a merchant's product to the shared catalog, or keep it private (role ADMIN)
      description: |
        `PROMOTE` moves the product to the shared catalog: the market keeps its listing and every
        other market can list it too. A shared product with the same barcode → 409
        `PRODUCT_DUPLICATE`. Shared products are not reviewed again → 409
        `INVALID_STATUS_TRANSITION`.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid }, description: Catalog product id. }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [PROMOTE, KEEP_PRIVATE] }
      responses:
        '200':
          description: The reviewed product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogReviewItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, example: de }
    Lat:
      name: lat
      in: query
      required: true
      schema: { type: number, minimum: -90, maximum: 90, example: 53.5511 }
    Lng:
      name: lng
      in: query
      required: true
      schema: { type: number, minimum: -180, maximum: 180, example: 9.9937 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    MarketId:
      name: marketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      description: Id of a market listing (a product as sold by one market).
      schema: { type: string, format: uuid }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ValidationError:
      description: Request failed validation (`code` = VALIDATION_FAILED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials (`code` = UNAUTHORIZED or INVALID_CREDENTIALS).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded (per client IP for login, social sign-in, registration, refresh and password reset, per user for uploads and product drafts; `code` = RATE_LIMITED); see the `Retry-After` header (seconds).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: The uploaded file is larger than 5 MB (`code` = FILE_TOO_LARGE).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The file is not a JPEG, PNG or WebP image by its content (`code` = UNSUPPORTED_MEDIA_TYPE). Also returned when the request body is not multipart/form-data.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not allowed, e.g. not a merchant or not the owner (`code` = FORBIDDEN).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not visible to the caller (`code` = NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (`code` = EMAIL_TAKEN, SLOT_FULL, LISTING_EXISTS, IDEMPOTENCY_KEY_REUSED, CONCURRENT_MODIFICATION or CONFLICT).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BusinessRuleViolation:
      description: |
        Business rule violated. Codes: PRODUCT_UNAVAILABLE, MAX_QUANTITY_EXCEEDED, MARKET_NOT_ACTIVE,
        ORDERS_NOT_ACCEPTED (ordering switched off or paused; removing items still works),
        FEATURE_DISABLED (a function platform admins switched off), FEEDBACK_DISABLED (the market takes no feedback),
        SLOT_UNAVAILABLE (the market closed that day), FULFILMENT_NOT_OFFERED, ADDRESS_REQUIRED, ADDRESS_OUTSIDE_DELIVERY_AREA, SLOT_CUTOFF_PASSED,
        SLOT_TYPE_MISMATCH, SLOT_NOT_RESERVED, CART_EMPTY, MINIMUM_ORDER_NOT_MET,
        ORDER_NOT_CANCELLABLE, INVALID_STATUS_TRANSITION.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: English developer message; clients show their own translation of `code`. }
        instance: { type: string }
        code:
          type: string
          example: VALIDATION_FAILED
          description: Stable machine-readable code. Besides the codes listed per response, any endpoint may return FORBIDDEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE or INTERNAL_ERROR. Upload codes are FILE_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, INVALID_IMAGE and IMAGE_TOO_LARGE.
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string, description: 'Validation code, e.g. NotBlank, Size, Pattern, Email.' }
              message: { type: string }
    Locale:
      type: object
      required: [code, nativeName, direction]
      properties:
        code: { type: string, example: ar }
        nativeName: { type: string, example: العربية }
        direction: { type: string, enum: [ltr, rtl] }
    LocalizedText:
      type: object
      description: 'Map of locale code to text, e.g. {"de": "Äpfel", "en": "Apples", "ar": "تفاح"}. At least the primary locale must be present.'
      additionalProperties: { type: string, maxLength: 2000 }
      minProperties: 1
    CodeName:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: BAKERY }
        name: { type: string, example: Bäckerei }
        iconKey: { type: [string, 'null'] }
    InsightTotals:
      type: object
      required: [orders, revenue, averageOrderValue, discounts]
      properties:
        orders: { type: integer, minimum: 0 }
        revenue: { $ref: '#/components/schemas/Money' }
        averageOrderValue:
          description: Revenue per order; null without orders.
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/Money' }
        discounts: { $ref: '#/components/schemas/Money' }
    MarketInsights:
      type: object
      required: [from, to, totals, previous, cancelledOrders, rejectedOrders, pickupOrders, deliveryOrders, customers, returningCustomers, daily, ordersByHour, topProducts]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: '#/components/schemas/InsightTotals' }
        previous: { $ref: '#/components/schemas/InsightTotals' }
        cancelledOrders: { type: integer, minimum: 0 }
        rejectedOrders: { type: integer, minimum: 0 }
        pickupOrders: { type: integer, minimum: 0 }
        deliveryOrders: { type: integer, minimum: 0 }
        customers: { type: integer, minimum: 0 }
        returningCustomers: { type: integer, minimum: 0 }
        daily:
          description: One entry per day from `from` to `to`, days without orders included.
          type: array
          items:
            type: object
            required: [date, orders, revenue]
            properties:
              date: { type: string, format: date }
              orders: { type: integer, minimum: 0 }
              revenue: { $ref: '#/components/schemas/Money' }
        ordersByHour:
          description: Counted orders by local hour they were placed (index 0 = 00:00–00:59).
          type: array
          minItems: 24
          maxItems: 24
          items: { type: integer, minimum: 0 }
        topProducts:
          description: Up to 10 best-selling listings by quantity, then revenue. The name is the current one in the requested language (the order snapshot if the listing is gone). `revenue` is the sum of the line totals, before order-level discounts and without delivery fees.
          type: array
          maxItems: 10
          items:
            type: object
            required: [listingId, name, quantity, revenue]
            properties:
              listingId: { type: string, format: uuid }
              name: { type: string }
              unitSize: { type: [string, 'null'] }
              imageUrl: { type: [string, 'null'], format: uri }
              quantity: { type: integer, minimum: 1 }
              revenue: { $ref: '#/components/schemas/Money' }
    ReorderResult:
      type: object
      required: [marketId, addedProducts, skipped]
      properties:
        marketId: { type: string, format: uuid }
        addedProducts:
          type: integer
          minimum: 0
          description: Number of products whose quantity in the cart went up.
        skipped:
          type: array
          items:
            type: object
            required: [productId, name, reason]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string, description: 'Current name, or the name on the order when the product is gone.' }
              reason: { type: string, enum: [REMOVED, UNAVAILABLE, LIMITED] }
    Money:
      type: object
      required: [amountCents, currency]
      properties:
        amountCents: { type: integer, format: int64, minimum: 0, maximum: 10000000, example: 249, description: 'Requests are limited to 0–10,000,000 cents (100,000 €).' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: EUR }
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    PostalCode:
      type: string
      description: German postal code (5 digits).
      pattern: '^[0-9]{5}$'
      example: '20099'
    Place:
      type: object
      required: [label, city, location]
      properties:
        label: { type: string, example: 'Lange Reihe 12, 20099 Hamburg (St. Georg)' }
        street: { type: [string, 'null'] }
        houseNumber: { type: [string, 'null'] }
        postalCode: { type: [string, 'null'] }
        district: { type: [string, 'null'], example: St. Georg }
        city: { type: string, example: Hamburg }
        location: { $ref: '#/components/schemas/GeoPoint' }

    # ---- auth
    Role:
      type: string
      enum: [CUSTOMER, MERCHANT, ADMIN]
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128, description: 'At most 72 bytes in UTF-8 (bcrypt limit; about 36 Arabic letters). Longer passwords fail with VALIDATION_FAILED, field code MaxUtf8Bytes.' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        accountType: { type: string, enum: [CUSTOMER, MERCHANT], default: CUSTOMER }
        preferredLocale: { type: [string, 'null'], example: de }
        acceptedTermsVersion: { type: [string, 'null'], maxLength: 40, description: 'The `legal.termsVersion` of `GET /platform` the user accepted (terms and privacy notice). Required when the platform sets one.' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    UpdateUserRequest:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        preferredLocale: { type: string }
    DeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096, description: FCM registration token. }
        platform: { type: string, enum: [IOS, ANDROID] }
    DeviceTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096 }
    Notification:
      type: object
      required: [id, kind, title, body, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [NEW_ORDER, ORDER_CANCELLED, ORDER_ACCEPTED, ORDER_REJECTED, ORDER_READY_FOR_PICKUP, ORDER_OUT_FOR_DELIVERY, ORDER_COMPLETED, ORDER_ADJUSTED] }
        title: { type: string }
        body: { type: string }
        orderId: { type: [string, 'null'], format: uuid }
        marketId: { type: [string, 'null'], format: uuid, description: 'For merchant notifications: the market whose order list to open.' }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    AccountExport:
      type: object
      required: [exportedAt, account, linkedSignIns, addresses, orders, favorites, notifications, pushEnabled, ownedMarketIds, feedback]
      properties:
        exportedAt: { type: string, format: date-time }
        account:
          type: object
          required: [id, email, firstName, lastName, roles]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            roles: { type: array, items: { type: string } }
            preferredLocale: { type: [string, 'null'] }
        linkedSignIns: { type: array, items: { type: string, enum: [APPLE, GOOGLE] } }
        addresses: { type: array, items: { type: object } }
        orders: { type: array, items: { type: object }, description: 'Orders with items, amounts in cents, slot and delivery address snapshot.' }
        favorites:
          type: object
          required: [marketIds, listingIds]
          properties:
            marketIds: { type: array, items: { type: string, format: uuid } }
            listingIds: { type: array, items: { type: string, format: uuid } }
        notifications:
          type: array
          items:
            type: object
            required: [kind, title, body, createdAt, read]
            properties:
              kind: { type: string }
              title: { type: string }
              body: { type: string }
              createdAt: { type: string, format: date-time }
              read: { type: boolean }
        pushEnabled: { type: boolean }
        ownedMarketIds: { type: array, items: { type: string, format: uuid } }
        feedback:
          type: array
          description: Feedback sent to markets.
          items:
            type: object
            required: [marketId, message, createdAt]
            properties:
              marketId: { type: string, format: uuid }
              rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
              message: { type: string }
              createdAt: { type: string, format: date-time }
    FeedbackAvailability:
      type: object
      required: [enabled, maxLength]
      properties:
        enabled: { type: boolean, description: The merchant takes feedback; the apps show the form only then. }
        maxLength: { type: integer, description: Longest message in characters. }
    FeedbackRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000 }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
    MarketFeedback:
      type: object
      required: [id, customerName, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerName: { type: string, description: First name only. }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    MerchantFeedbackPage:
      type: object
      required: [enabled, feedback]
      properties:
        enabled: { type: boolean }
        feedback:
          type: object
          required: [items, page, size, totalItems, totalPages]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/MarketFeedback' } }
            page: { type: integer }
            size: { type: integer }
            totalItems: { type: integer, format: int64 }
            totalPages: { type: integer }
    NotificationSettings:
      type: object
      required: [pushEnabled]
      properties:
        pushEnabled: { type: boolean }
    NotificationPage:
      type: object
      required: [items, page, size, totalItems, totalPages, unreadCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
        unreadCount: { type: integer, format: int64 }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn, user]
      properties:
        accessToken: { type: string, description: 'JWT for `Authorization: Bearer`; short-lived (15 minutes by default).' }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Seconds until the access token expires. }
        refreshToken: { type: string, description: 'Opaque, single use: send it to /auth/refresh before or after the access token expires. Store it like a password (Keychain).' }
        refreshExpiresIn: { type: integer, description: Seconds until the refresh token expires (30 days by default). }
        user: { $ref: '#/components/schemas/User' }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 10, maxLength: 128, description: At most 72 bytes in UTF-8. }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 10, maxLength: 128, description: At most 72 bytes in UTF-8. }
    SocialSignInRequest:
      type: object
      required: [provider, idToken]
      properties:
        provider: { type: string, enum: [APPLE, GOOGLE] }
        idToken: { type: string, maxLength: 8192 }
        nonce: { type: [string, 'null'], maxLength: 256, description: The raw nonce the app passed to the provider. }
        firstName: { type: [string, 'null'], minLength: 1, maxLength: 100, description: Apple sends the name to the app only on the first sign-in. }
        lastName: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        accountType: { type: [string, 'null'], enum: [CUSTOMER, MERCHANT, null] }
        preferredLocale: { type: [string, 'null'] }
        acceptedTermsVersion: { type: [string, 'null'], maxLength: 40, description: As for register; needed only when the sign-in creates an account. }
    Platform:
      type: object
      required: [legal, supportEmail, payment]
      properties:
        legal:
          type: object
          required: [imprintUrl, privacyUrl, termsUrl, termsVersion]
          properties:
            imprintUrl: { type: [string, 'null'], format: uri }
            privacyUrl: { type: [string, 'null'], format: uri }
            termsUrl: { type: [string, 'null'], format: uri }
            termsVersion: { type: [string, 'null'], maxLength: 40, description: 'Version new accounts accept; null = no acceptance required.' }
        supportEmail: { type: [string, 'null'], format: email }
        payment: { type: string, enum: [SIMULATED, ON_SITE] }
    User:
      type: object
      required: [id, email, firstName, lastName, roles, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        preferredLocale: { type: [string, 'null'] }
        emailVerified: { type: boolean, description: Whether the email address is confirmed (verifyEmail). }

    # ---- markets
    FulfilmentType:
      type: string
      enum: [DELIVERY, PICKUP]
    MarketStatus:
      type: string
      enum: [PENDING_REVIEW, ACTIVE, SUSPENDED]
    PaymentMethod:
      type: string
      enum: [CASH, CARD]
    OrderSettings:
      type: object
      description: |
        What a merchant controls about ordering. A `null` number means the platform default
        (`MerchantOrderSettings.defaults`).
      required: [ordersEnabled, deliveryHours, autoAccept, paymentMethods]
      properties:
        ordersEnabled: { type: boolean, description: Online orders on or off (off = showcase). }
        pausedUntil: { type: [string, 'null'], format: date-time, description: No new orders before this time. }
        closedFrom: { type: [string, 'null'], format: date, description: 'Holiday, local date; set together with closedUntil.' }
        closedUntil: { type: [string, 'null'], format: date }
        deliveryCapacity: { type: [integer, 'null'], minimum: 1, maximum: 99, description: Deliveries per slot. }
        pickupCapacity: { type: [integer, 'null'], minimum: 1, maximum: 99, description: Pickups per slot. }
        deliveryLeadMinutes: { type: [integer, 'null'], minimum: 0, maximum: 2880, description: Order at least this long before a delivery slot starts. }
        pickupLeadMinutes: { type: [integer, 'null'], minimum: 0, maximum: 2880 }
        daysAhead: { type: [integer, 'null'], minimum: 1, maximum: 14, description: How many days (from today) customers can book. }
        deliveryHours:
          type: array
          maxItems: 28
          items: { $ref: '#/components/schemas/OpeningHours' }
          description: Delivery times when they differ from the opening hours; empty = opening hours.
        autoAccept: { type: boolean, description: New orders go straight to ACCEPTED. }
        paymentMethods: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/PaymentMethod' } }
        defaultMaxOrderQuantity: { type: [integer, 'null'], minimum: 1, maximum: 99, description: For new products without their own maximum. }
    MerchantOrderSettings:
      allOf:
        - $ref: '#/components/schemas/OrderSettings'
        - type: object
          required: [defaults]
          properties:
            defaults:
              type: object
              required: [deliveryCapacity, pickupCapacity, deliveryLeadMinutes, pickupLeadMinutes, daysAhead, maxOrderQuantity]
              properties:
                deliveryCapacity: { type: integer }
                pickupCapacity: { type: integer }
                deliveryLeadMinutes: { type: integer }
                pickupLeadMinutes: { type: integer }
                daysAhead: { type: integer }
                maxOrderQuantity: { type: integer }
    OpeningHours:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      description: |
        One opening interval in the market's local time (Europe/Berlin), starting on `dayOfWeek`.
        Several intervals per day are allowed (e.g. a lunch break). A `closesAt` earlier than
        `opensAt` means the next day (`18:00`–`02:00`; `00:00` = midnight). Equal times answer 400
        `NotEqualOpensAt`; overlapping intervals (also across midnight and Sunday → Monday) 400
        `Overlap` on field `openingHours`.
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: 1 = Monday (ISO 8601). }
        opensAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '08:00' }
        closesAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '20:00' }
    FulfilmentOptions:
      type: object
      required: [delivery, pickup, minimumOrderValue]
      properties:
        delivery: { type: boolean }
        pickup: { type: boolean }
        deliveryRadiusKm: { type: [number, 'null'], minimum: 0.5, maximum: 50 }
        deliveryFee:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        freeDeliveryFrom:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        minimumOrderValue: { $ref: '#/components/schemas/Money' }
    RecentMarket:
      type: object
      required: [market, lastOrderAt, lastOrderId, orderCount, recentProducts]
      properties:
        market: { $ref: '#/components/schemas/MarketSummary' }
        lastOrderAt: { type: [string, 'null'], format: date-time }
        lastOrderId: { type: [string, 'null'], format: uuid }
        orderCount: { type: integer, minimum: 0 }
        recentProducts:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ProductSummary' }
    MarketSummary:
      type: object
      required: [id, slug, name, type, cuisines, location, addressLine, openNow, fulfilment, activePromotionCount, tags, acceptsOrders]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/CodeName' }
        cuisines: { type: array, items: { $ref: '#/components/schemas/CodeName' } }
        logoUrl: { type: [string, 'null'], format: uri }
        coverImageUrl: { type: [string, 'null'], format: uri }
        location: { $ref: '#/components/schemas/GeoPoint' }
        addressLine: { type: string, example: 'Steindamm 30, 20099 Hamburg' }
        distanceMeters: { type: [integer, 'null'] }
        deliversToLocation: { type: [boolean, 'null'], description: Whether the requested location is inside the delivery radius (null without lat/lng). }
        openNow: { type: boolean }
        todayHours: { type: [string, 'null'], example: '08:00–20:00' }
        nextOpeningAt: { type: [string, 'null'], format: date-time }
        fulfilment: { $ref: '#/components/schemas/FulfilmentOptions' }
        activePromotionCount: { type: integer }
        tags: { type: array, items: { type: string, enum: [ORGANIC, REGIONAL, HALAL, VEGAN_FRIENDLY] } }
        acceptsOrders:
          type: boolean
          description: |
            New orders are possible now. False while the merchant has switched online orders off
            (the market is a showcase: show products, hide cart and order buttons, no notice) or
            paused them (`ordersPausedUntil`).
        ordersPausedUntil:
          type: [string, 'null']
          format: date-time
          description: Set only during a pause; show "orders again from …".
        closedFrom:
          type: [string, 'null']
          format: date
          description: A holiday that has not ended yet (local dates, both inclusive); no slots on these days.
        closedUntil: { type: [string, 'null'], format: date }
    MarketDetail:
      allOf:
        - $ref: '#/components/schemas/MarketSummary'
        - type: object
          required: [openingHours, primaryLocale, imprint, paymentMethods]
          properties:
            paymentMethods:
              type: array
              items: { $ref: '#/components/schemas/PaymentMethod' }
              description: How customers pay at handover; show only when the platform payment mode is ON_SITE.
            description: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            openingHours: { type: array, items: { $ref: '#/components/schemas/OpeningHours' } }
            primaryLocale: { type: string, example: de }
            imprint:
              type: object
              required: [legalName, addressLine]
              properties:
                legalName: { type: string }
                addressLine: { type: string }
                registerInfo: { type: [string, 'null'] }
    MarketPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    Banner:
      type: object
      required: [id, title, target]
      properties:
        id: { type: string, format: uuid }
        overline: { type: [string, 'null'], example: 'Saftig und frisch' }
        title: { type: string, example: Obst und Gemüse der Saison }
        imageUrl: { type: [string, 'null'], format: uri }
        tint: { type: string, enum: [sage, sky, blush, sand, rose], default: sage, description: Placeholder tint when imageUrl is null. }
        target:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [CATEGORY, PROMOTIONS, NEW, PRODUCT] }
            id: { type: [string, 'null'], format: uuid }
    HomeSection:
      type: object
      required: [key, title, items]
      properties:
        key:
          type: string
          enum: [PROMOTIONS, BESTSELLERS, NEW, FREQUENTLY_ORDERED, CATEGORY]
          description: BESTSELLERS are the available products sold most in the last 30 days (shown from 3 products on).
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        categoryId: { type: [string, 'null'], format: uuid }
        items: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } }
    MarketHome:
      type: object
      required: [market, banners, sections]
      properties:
        market: { $ref: '#/components/schemas/MarketSummary' }
        banners: { type: array, items: { $ref: '#/components/schemas/Banner' } }
        sections: { type: array, items: { $ref: '#/components/schemas/HomeSection' } }

    # ---- catalog
    Category:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        slug: { type: string }
        name: { type: string }
        iconKey: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'], format: uri }
        sortOrder: { type: integer }
        productCount: { type: [integer, 'null'], description: Set on market-scoped lists. }
    PromotionType:
      type: string
      enum: [PERCENT_OFF, MULTI_BUY, FIXED_PRICE]
      description: |
        PERCENT_OFF: a percentage off every unit. MULTI_BUY: quantity prices (`tiers`, e.g. 3 for
        5 € and 7 for 10 €); a cart line costs the cheapest combination of tiers and single units.
        FIXED_PRICE: an offer price per product (`offers`, e.g. 5 € → 2 €).
    PromotionBadge:
      type: object
      required: [promotionId, label, type]
      properties:
        promotionId: { type: string, format: uuid }
        label: { type: string, example: '20 % Rabatt', description: Localised badge text. }
        type: { $ref: '#/components/schemas/PromotionType' }
    UnitPrice:
      type: object
      required: [price, unit]
      properties:
        price: { $ref: '#/components/schemas/Money' }
        unit: { type: string, enum: [kg, l, piece] }
    FeatureSwitches:
      type: object
      required: [SHOPPING_LIST, SHOPPING_LIST_VOICE, SHOPPING_LIST_MEDIA, MERCHANT_MULTILINGUAL]
      properties:
        SHOPPING_LIST: { type: boolean, description: Shopping list in a market (typed list). }
        SHOPPING_LIST_VOICE: { type: boolean, description: Speak the list. }
        SHOPPING_LIST_MEDIA: { type: boolean, description: Photos or a short video of the list. }
        MERCHANT_MULTILINGUAL: { type: boolean, description: 'Merchants enter texts in every language; off: only in the market''s language.' }
    ShoppingListCapabilities:
      type: object
      required: [enabled, voice, media, ai, maxImages, maxTextLength]
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: 'Platform admins switched the shopping list on (getFeatures SHOPPING_LIST). Off: no entry in the app.' }
        voice: { type: boolean, description: Speaking the list is switched on (speech recognition on the device). }
        media: { type: boolean, description: Photos and videos are switched on and can be read (needs `ai`). }
        ai: { type: boolean, description: 'Photos and videos can be read; dictated lists are read by the model too.' }
        maxImages: { type: integer, example: 4 }
        maxTextLength: { type: integer, example: 2000 }
    ShoppingListResult:
      type: object
      required: [engine, lines]
      additionalProperties: false
      properties:
        engine: { type: string, enum: [AI, RULES] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ShoppingListLine' }
    ShoppingListLine:
      type: object
      required: [text, amount, match, alternatives]
      additionalProperties: false
      properties:
        text: { type: string, description: 'The item in the customer''s words, e.g. "1 kg Tomaten".', example: 1 kg Tomaten }
        amount: { type: [string, 'null'], description: 'Weight or volume asked for; null for counts.', example: 1 kg }
        match:
          description: The best available product; null when nothing in the market fits.
          oneOf:
            - { $ref: '#/components/schemas/ShoppingListChoice' }
            - { type: 'null' }
        alternatives:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/ShoppingListChoice' }
    ShoppingListChoice:
      type: object
      required: [product, quantity]
      additionalProperties: false
      properties:
        product: { $ref: '#/components/schemas/ProductSummary' }
        quantity: { type: integer, minimum: 1, description: 'Units that cover the amount, within maxOrderQuantity.' }
    ProductSummary:
      type: object
      required: [id, marketId, name, unitSize, price, available, organic, isNew, maxOrderQuantity]
      properties:
        id: { type: string, format: uuid, description: Listing id. }
        marketId: { type: string, format: uuid }
        catalogProductId: { type: string, format: uuid }
        name: { type: string }
        brand: { type: [string, 'null'] }
        tagline: { type: [string, 'null'], example: süß-säuerlich }
        unitSize: { type: string, example: 550 g }
        imageUrl: { type: [string, 'null'], format: uri }
        iconKey: { type: [string, 'null'], description: 'Placeholder icon hint while imageUrl is null. Product keys: apple, banana, carrot, cherry, citrus, leafy-green, pepper, egg, milk, cheese, beef, sausage, poultry, fish, bread, pastry, grain, legume, pasta, coffee, tea, soda, beer, sweets, spice, oil, sauce, nut; otherwise the category iconKey. Clients map unknown keys to a generic icon.' }
        price: { $ref: '#/components/schemas/Money' }
        promotionalPrice:
          description: Effective unit price under a PERCENT_OFF promotion (show the regular price struck through).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        comparisonPrice:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UnitPrice'
        promotion:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PromotionBadge'
        available: { type: boolean }
        organic: { type: boolean }
        isNew: { type: boolean }
        maxOrderQuantity: { type: integer }
        favorite: { type: [boolean, 'null'], description: Set for signed-in callers. }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [categoryId, allergens, cuisines, market]
          properties:
            categoryId: { type: string, format: uuid }
            description: { type: [string, 'null'] }
            ingredients: { type: [string, 'null'] }
            allergens: { type: array, items: { type: string } }
            origin: { type: [string, 'null'] }
            cuisines: { type: array, items: { $ref: '#/components/schemas/CodeName' } }
            barcode: { type: [string, 'null'] }
            market: { $ref: '#/components/schemas/MarketSummary' }
    ProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    MarketOffer:
      type: object
      required: [product, market]
      properties:
        product: { $ref: '#/components/schemas/ProductSummary' }
        market: { $ref: '#/components/schemas/MarketSummary' }
    MarketOfferPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketOffer' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    Promotion:
      type: object
      required: [id, marketId, title, type, validFrom, validUntil, productIds]
      properties:
        id: { type: string, format: uuid }
        marketId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/PromotionType' }
        percentOff: { type: [integer, 'null'], minimum: 1, maximum: 90 }
        bundleQuantity: { type: [integer, 'null'], minimum: 2, description: 'MULTI_BUY: the smallest tier (older clients).' }
        bundlePrice:
          description: 'MULTI_BUY: the price of the smallest tier (older clients).'
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        tiers: { type: array, items: { $ref: '#/components/schemas/PromotionTier' }, description: 'MULTI_BUY: all quantity prices, smallest first.' }
        offers: { type: array, items: { $ref: '#/components/schemas/PromotionOffer' }, description: 'FIXED_PRICE: the offer price per product.' }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        weekdays:
          type: [array, 'null']
          items: { type: integer, minimum: 1, maximum: 7 }
          description: Runs only on these days (ISO, 1 = Monday); null = every day.
        dailyFrom: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$', description: 'Runs daily from this time (Berlin, "HH:mm"); null = all day.' }
        dailyUntil: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$', description: Until this time (exclusive). }
        productIds: { type: array, items: { type: string, format: uuid } }
    PromotionTier:
      type: object
      required: [quantity, price]
      properties:
        quantity: { type: integer, minimum: 2, maximum: 99 }
        price: { $ref: '#/components/schemas/Money' }
    PromotionOffer:
      type: object
      required: [productId, offerPrice]
      properties:
        productId: { type: string, format: uuid }
        offerPrice: { $ref: '#/components/schemas/Money' }
    FavoriteGroup:
      type: object
      required: [category, items]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ProductSummary'
              - type: object
                required: [favoriteReason]
                properties:
                  favoriteReason: { type: string, enum: [MANUAL, FREQUENTLY_ORDERED] }

    # ---- cart and fulfilment
    SetQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 0, maximum: 99 }
    ReserveFulfilmentRequest:
      type: object
      required: [type, slotId]
      properties:
        type: { $ref: '#/components/schemas/FulfilmentType' }
        slotId: { type: string, format: uuid }
        addressId: { type: [string, 'null'], format: uuid, description: Required for DELIVERY. }
    Slot:
      type: object
      required: [id, type, startsAt, endsAt, orderCutoffAt, fee, available, remainingCapacity]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/FulfilmentType' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        orderCutoffAt: { type: string, format: date-time }
        fee: { $ref: '#/components/schemas/Money' }
        available: { type: boolean }
        remainingCapacity: { type: integer, minimum: 0 }
    FulfilmentReservation:
      type: object
      required: [type, slot, expiresAt]
      properties:
        type: { $ref: '#/components/schemas/FulfilmentType' }
        slot: { $ref: '#/components/schemas/Slot' }
        addressId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: string, format: date-time }
    CartItem:
      type: object
      required: [productId, name, unitSize, unitPrice, quantity, lineSubtotal, lineDiscount, lineTotal, maxOrderQuantity]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        unitSize: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
        iconKey: { type: [string, 'null'], description: Same as ProductSummary.iconKey. }
        unitPrice: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer, minimum: 1 }
        lineSubtotal: { $ref: '#/components/schemas/Money' }
        lineDiscount: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
        promotion:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PromotionBadge'
        available: { type: boolean }
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 99 }
    Cart:
      type: object
      required: [id, market, items, itemCount, subtotal, discountTotal, deliveryFee, total, minimumOrderValue, meetsMinimumOrderValue]
      properties:
        id: { type: string, format: uuid }
        market: { $ref: '#/components/schemas/MarketSummary' }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        itemCount: { type: integer }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        deliveryFee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        minimumOrderValue: { $ref: '#/components/schemas/Money' }
        meetsMinimumOrderValue: { type: boolean }
        fulfilment:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FulfilmentReservation'
    CartSummary:
      type: object
      required: [cartId, market, itemCount, total, updatedAt]
      properties:
        cartId: { type: string, format: uuid }
        market: { $ref: '#/components/schemas/MarketSummary' }
        itemCount: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
        updatedAt: { type: string, format: date-time }

    # ---- addresses
    AddressRequest:
      type: object
      required: [street, houseNumber, postalCode, city]
      properties:
        label: { type: [string, 'null'], maxLength: 50 }
        street: { type: string, minLength: 1, maxLength: 120 }
        houseNumber: { type: string, minLength: 1, maxLength: 10 }
        addition: { type: [string, 'null'], maxLength: 50 }
        postalCode: { $ref: '#/components/schemas/PostalCode' }
        city: { type: string, minLength: 1, maxLength: 80 }
        deliveryInstructions: { type: [string, 'null'], maxLength: 300 }
        location:
          description: Coordinates from /geo/search or the map pin. When absent the server geocodes the address (and stores null if it cannot).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/GeoPoint'
        isDefault: { type: boolean, default: false }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressRequest'
        - type: object
          required: [id, countryCode, isDefault]
          properties:
            id: { type: string, format: uuid }
            countryCode: { type: string, enum: [DE] }

    # ---- orders
    OrderStatus:
      type: string
      enum: [PLACED, ACCEPTED, REJECTED, READY_FOR_PICKUP, OUT_FOR_DELIVERY, COMPLETED, CANCELLED]
    OrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
    OrderItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [lineNo, fulfilledQuantity]
            properties:
              lineNo: { type: integer, minimum: 1 }
              fulfilledQuantity: { type: integer, minimum: 0, maximum: 99, description: 'Units handed over; 0 = missing.' }
    OrderItem:
      type: object
      required: [lineNo, productId, name, unitPrice, quantity, fulfilledQuantity, lineTotal]
      properties:
        lineNo: { type: integer, minimum: 1 }
        productId: { type: string, format: uuid }
        name: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer, description: Units ordered. }
        fulfilledQuantity:
          type: [integer, 'null']
          description: Units handed over when fewer than ordered (missing items); null = as ordered.
        lineTotal: { $ref: '#/components/schemas/Money', description: 'Charged amount of the line (after missing items).' }
    Order:
      type: object
      required: [id, orderNumber, status, placedAt, market, fulfilmentType, items, subtotal, discountTotal, deliveryFee, total, slot]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: DK-20261020-000042 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        placedAt: { type: string, format: date-time }
        market: { $ref: '#/components/schemas/MarketSummary' }
        fulfilmentType: { $ref: '#/components/schemas/FulfilmentType' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        deliveryFee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        slot: { $ref: '#/components/schemas/Slot' }
        deliveryAddress:
          description: Snapshot; null for PICKUP.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Address'
        customerName: { type: [string, 'null'], description: Only in merchant views. }
        originalTotal:
          description: The total when ordered, set once the market adjusted items (missing items); null otherwise.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'

    # ---- merchant
    MarketProfileRequest:
      type: object
      required: [name, typeCode, primaryLocale, addressLine, location, fulfilment, openingHours, legalName]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        typeCode: { type: string, example: GROCERY }
        cuisineCodes: { type: array, items: { type: string }, maxItems: 5 }
        description: { $ref: '#/components/schemas/LocalizedText' }
        primaryLocale: { type: string, example: de }
        addressLine: { type: string, minLength: 5, maxLength: 200 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        phone: { type: [string, 'null'], maxLength: 30 }
        logoUrl: { type: [string, 'null'], format: uri }
        coverImageUrl: { type: [string, 'null'], format: uri }
        tags: { type: array, items: { type: string, enum: [ORGANIC, REGIONAL, HALAL, VEGAN_FRIENDLY] } }
        fulfilment: { $ref: '#/components/schemas/FulfilmentOptions' }
        openingHours: { type: array, items: { $ref: '#/components/schemas/OpeningHours' }, minItems: 1 }
        legalName: { type: string, minLength: 2, maxLength: 120 }
        registerInfo: { type: [string, 'null'], maxLength: 120 }
    MerchantMarket:
      allOf:
        - $ref: '#/components/schemas/MarketDetail'
        - type: object
          required: [status, descriptions, review]
          properties:
            status: { $ref: '#/components/schemas/MarketStatus' }
            descriptions:
              type: object
              additionalProperties: { type: string }
              description: The description in every language (locale → text); `description` is only the requested one. Prefill profile forms from this, since updateMyMarket replaces all languages.
            review: { $ref: '#/components/schemas/MarketReview' }
    MarketReview:
      type: object
      description: |
        Whether the seller information is complete enough to approve the market (imprint § 5 DDG,
        trader traceability Art. 30 DSA). Items with `required` block approval (`MARKET_INCOMPLETE`);
        the others are hints for the reviewer.
      required: [complete, items]
      properties:
        complete: { type: boolean, description: All required items are ok. }
        items:
          type: array
          items:
            type: object
            required: [code, ok, required]
            properties:
              code:
                type: string
                enum: [LEGAL_NAME, POSTAL_ADDRESS, PHONE, REGISTER_INFO]
                description: |
                  LEGAL_NAME: first and last name, or company name with legal form.
                  POSTAL_ADDRESS: address line with a postcode.
                  PHONE: a phone number.
                  REGISTER_INFO: register court and number (only registered businesses have one).
              ok: { type: boolean }
              required: { type: boolean }
    CatalogProduct:
      type: object
      required: [id, name, unitSize, categoryId, cuisines, organic]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: [string, 'null'] }
        unitSize: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
        iconKey: { type: [string, 'null'], description: Same as ProductSummary.iconKey. }
        categoryId: { type: string, format: uuid }
        cuisines: { type: array, items: { $ref: '#/components/schemas/CodeName' } }
        organic: { type: boolean }
        barcode: { type: [string, 'null'] }
        alreadyListed: { type: [boolean, 'null'], description: Whether the market given by marketId (or the merchant's only market) already sells it. }
    CatalogProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogProduct' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    NewCatalogProduct:
      type: object
      description: A market-private product when the shared catalog has no match.
      required: [name, unitSize, categoryId]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        tagline: { $ref: '#/components/schemas/LocalizedText' }
        keywords: { type: array, items: { type: string, maxLength: 60 }, maxItems: 30, description: Search keywords in any language. }
        brand: { type: [string, 'null'], maxLength: 80 }
        unitSize: { type: string, minLength: 1, maxLength: 40 }
        netQuantity: { type: [number, 'null'], exclusiveMinimum: 0 }
        netUnit: { type: [string, 'null'], enum: [kg, l, piece, null] }
        categoryId: { type: string, format: uuid }
        cuisineCodes: { type: array, items: { type: string } }
        organic: { type: boolean, default: false }
        allergens: { type: array, items: { type: string } }
        imageUrl: { type: [string, 'null'], format: uri }
        barcode: { type: [string, 'null'], maxLength: 20 }
    ListingImportResult:
      type: object
      required: [dryRun, applied, created, listed, updated, failed, rows]
      properties:
        dryRun: { type: boolean }
        applied: { type: boolean, description: True when the rows were written. }
        created: { type: integer, description: New private products. }
        listed: { type: integer, description: Existing products now listed by the market. }
        updated: { type: integer, description: Listings updated. }
        failed: { type: integer, description: Rows with errors. }
        rows: { type: array, items: { $ref: '#/components/schemas/ListingImportRow' } }
    ListingImportRow:
      type: object
      required: [line, action, errors]
      properties:
        line: { type: integer, description: Row number in the spreadsheet (header = 1). }
        action: { type: string, enum: [CREATE, LIST, UPDATE, ERROR] }
        name: { type: [string, 'null'] }
        listingId: { type: [string, 'null'], format: uuid, description: Set when applied (and for UPDATE). }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, description: 'CSV column, e.g. price or name_de.' }
              code: { type: string, description: 'e.g. Required, Pattern, UnknownCode, Duplicate, PrimaryLocaleRequired.' }
              message: { type: string }
    CatalogImportResult:
      type: object
      required: [dryRun, applied, created, existing, failed, rows]
      properties:
        dryRun: { type: boolean }
        applied: { type: boolean, description: True when the products were written. }
        created: { type: integer, description: New shared products (to be created in a dry run). }
        existing: { type: integer, description: Rows already in the shared catalog (skipped). }
        failed: { type: integer, description: Rows with errors. }
        rows:
          type: array
          items:
            type: object
            required: [line, action, errors]
            properties:
              line: { type: integer, description: Row number in the spreadsheet (header = 1). }
              action: { type: string, enum: [CREATE, EXISTS, ERROR] }
              name: { type: [string, 'null'] }
              productId: { type: [string, 'null'], format: uuid, description: 'The catalog product (EXISTS, or CREATE once applied).' }
              errors:
                type: array
                items:
                  type: object
                  required: [field, code, message]
                  properties:
                    field: { type: string }
                    code: { type: string }
                    message: { type: string }
    CatalogReviewPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogReviewItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    CatalogReviewItem:
      type: object
      required: [id, unitSize, reviewStatus, createdAt, texts, duplicates, restrictedGoodsHint]
      properties:
        id: { type: string, format: uuid, description: Catalog product id. }
        market:
          description: The owning market; null once promoted.
          oneOf:
            - type: 'null'
            - { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        category:
          oneOf:
            - type: 'null'
            - { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        brand: { type: [string, 'null'] }
        unitSize: { type: string }
        barcode: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        reviewStatus: { type: string, enum: [PENDING, KEPT_PRIVATE, PROMOTED] }
        createdAt: { type: string, format: date-time }
        texts:
          type: object
          description: Locale code → text.
          additionalProperties:
            type: object
            required: [name, machineTranslated]
            properties:
              name: { type: string }
              description: { type: [string, 'null'] }
              machineTranslated: { type: boolean }
        restrictedGoodsHint: { type: boolean, description: A name or the brand looks like alcohol or tobacco (not allowed on Dukkan). }
        duplicates:
          type: array
          items:
            type: object
            required: [id, name, unitSize]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              unitSize: { type: string }
              barcode: { type: [string, 'null'] }
    TranslationRequest:
      type: object
      required: [kind, fields]
      properties:
        kind: { type: string, enum: [PRODUCT_NAME, PRODUCT_DESCRIPTION, PROMOTION, MARKET_DESCRIPTION] }
        fields: { type: array, items: { $ref: '#/components/schemas/TranslationField' }, minItems: 1, maxItems: 20 }
    TranslationField:
      type: object
      required: [key, values]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9_.-]+$', maxLength: 40, description: 'Caller-chosen id, echoed in the result.' }
        values: { type: object, additionalProperties: { type: string, maxLength: 2000 }, description: Locale code → text; empty values are translated. }
    TranslationResult:
      type: object
      required: [fields]
      properties:
        fields: { type: array, items: { $ref: '#/components/schemas/TranslationField' } }
    ProductDraftRequest:
      type: object
      description: At least one of `text` and `imageKey` (otherwise 400 VALIDATION_FAILED).
      properties:
        text: { type: [string, 'null'], maxLength: 1000, description: 'Free text in any language (name, size, price, …).' }
        imageKey:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}\.(jpg|png|webp)$'
          description: '`key` of an uploadMedia result. Unknown keys answer 400 VALIDATION_FAILED (field `imageKey`, code `NotFound`).'
    ProductDraftWarning:
      type: string
      description: |
        `AI_NOT_CONFIGURED` no language model is configured, `AI_UNAVAILABLE` the model failed or
        timed out, `AI_DECLINED` the model declined the request, `IMAGE_NOT_ANALYSED` a photo was
        sent but only the rule-based parser ran (or the photo was too large for the model),
        `NAME_MISSING`, `CATEGORY_UNCERTAIN`, `UNIT_SIZE_MISSING`, `PRICE_MISSING` fields the
        merchant has to fill in.
      enum: [AI_NOT_CONFIGURED, AI_UNAVAILABLE, AI_DECLINED, IMAGE_NOT_ANALYSED, NAME_MISSING, CATEGORY_UNCERTAIN, UNIT_SIZE_MISSING, PRICE_MISSING]
    ProductDraftProduct:
      type: object
      description: Like NewCatalogProduct, but every field may still be missing.
      required: [name, description, keywords, cuisineCodes, organic, allergens]
      properties:
        name: { type: object, additionalProperties: { type: string, maxLength: 120 }, description: Locale code → name; may be empty. }
        description: { type: object, additionalProperties: { type: string, maxLength: 2000 } }
        keywords: { type: array, items: { type: string, maxLength: 60 }, maxItems: 30 }
        brand: { type: [string, 'null'], maxLength: 80 }
        unitSize: { type: [string, 'null'], maxLength: 40 }
        netQuantity: { type: [number, 'null'], exclusiveMinimum: 0 }
        netUnit: { type: [string, 'null'], enum: [kg, l, piece, null] }
        categoryId: { type: [string, 'null'], format: uuid }
        cuisineCodes: { type: array, items: { type: string } }
        organic: { type: boolean }
        allergens: { type: array, items: { type: string }, description: 'EU allergen codes: gluten, crustaceans, eggs, fish, peanuts, soy, milk, nuts, celery, mustard, sesame, sulphites, lupin, molluscs.' }
        imageUrl: { type: [string, 'null'], format: uri, description: URL of `imageKey` when one was sent. }
        barcode: { type: [string, 'null'], maxLength: 20 }
    ProductDraft:
      type: object
      required: [engine, product, catalogMatches, warnings]
      properties:
        engine: { type: string, enum: [AI, RULES] }
        product: { $ref: '#/components/schemas/ProductDraftProduct' }
        price:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        catalogMatches:
          type: array
          maxItems: 5
          description: Shared catalog products that look like the same product, best first (`alreadyListed` set for this market).
          items: { $ref: '#/components/schemas/CatalogProduct' }
        warnings: { type: array, items: { $ref: '#/components/schemas/ProductDraftWarning' } }
    CreateListingRequest:
      type: object
      description: Exactly one of catalogProductId or newProduct.
      required: [price]
      properties:
        catalogProductId: { type: [string, 'null'], format: uuid }
        newProduct:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NewCatalogProduct'
        price: { $ref: '#/components/schemas/Money' }
        available: { type: boolean, default: true }
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 99, default: 24 }
        overrides:
          description: The market's own details of a catalog product (not with newProduct, error CatalogProductOnly).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ListingOverrides'
    UpdateListingRequest:
      type: object
      description: Partial update; absent properties stay unchanged.
      properties:
        price: { $ref: '#/components/schemas/Money' }
        available: { type: boolean }
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 99 }
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 500
          description: |
            The market's own photo of the product (e.g. a `url` from uploadMedia). Absent = unchanged,
            `null` = remove it. For a shared catalog product it only applies to this market's listing
            (the catalog image, if any, shows again after removal); for a private product it is the
            product image.
        overrides:
          description: Replaces the market's own details (all fields empty = the catalog values again). Absent = unchanged.
          $ref: '#/components/schemas/ListingOverrides'
    Listing:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [privateProduct, restrictedGoodsHint]
          properties:
            privateProduct: { type: boolean, description: True when created by this market instead of picked from the shared catalog. }
            restrictedGoodsHint: { type: boolean, description: 'The name looks like alcohol or tobacco, which Dukkan does not allow; a hint for the merchant, never a block.' }
            overrides:
              description: The market's own details of this listing; absent when it shows the catalog values.
              $ref: '#/components/schemas/ListingOverrides'
    ListingOverrides:
      type: object
      description: |
        A market's own details of a shared catalog product, in the market's language and shown to
        customers in every language. They apply to this market's listing only and never change the
        shared catalog. Absent, null or blank fields show the catalog value. The own name is
        searchable in the market.
      properties:
        name: { type: [string, 'null'], maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        unitSize: { type: [string, 'null'], maxLength: 40, examples: ['500 ml'] }
        brand: { type: [string, 'null'], maxLength: 80 }
    ListingPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Listing' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    MediaPurpose:
      type: string
      enum: [LOGO, COVER, BANNER, PRODUCT]
      description: Where the image will be used. Recorded for logging; the same limits apply to all.
    MediaUpload:
      type: object
      required: [key, url, width, height, contentType, sizeBytes]
      properties:
        key: { type: string, example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b.jpg }
        url: { type: string, format: uri, description: 'Absolute public URL (`dukkan.media.public-base-url` + `/` + key; by default derived from the request: `<origin>/api/v1/media/<key>`).' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, format: int64 }
    PromotionRequest:
      type: object
      required: [title, type, validFrom, validUntil]
      description: |
        PERCENT_OFF needs `percentOff`; MULTI_BUY needs `tiers` (or the older single
        `bundleQuantity` + `bundlePrice`), at most 5 with distinct quantities; FIXED_PRICE needs
        `offers`, each below the product's price (else 400 `BelowRegularPrice`); their products need
        not be repeated in `productIds`. At least one product in total. `weekdays` and the daily
        window narrow `validFrom`–`validUntil` (errors `Weekdays`, `DailyWindow`).
      properties:
        title: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        type: { $ref: '#/components/schemas/PromotionType' }
        percentOff: { type: [integer, 'null'], minimum: 1, maximum: 90 }
        bundleQuantity: { type: [integer, 'null'], minimum: 2, maximum: 99 }
        bundlePrice:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        tiers: { type: [array, 'null'], items: { $ref: '#/components/schemas/PromotionTier' }, maxItems: 5 }
        offers: { type: [array, 'null'], items: { $ref: '#/components/schemas/PromotionOffer' }, maxItems: 200 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        weekdays: { type: [array, 'null'], items: { type: integer, minimum: 1, maximum: 7 }, minItems: 1, maxItems: 7 }
        dailyFrom: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$', examples: ['08:00'] }
        dailyUntil: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$', examples: ['12:00'] }
        productIds: { type: [array, 'null'], items: { type: string, format: uuid }, maxItems: 200 }
