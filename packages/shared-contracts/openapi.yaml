        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/cart/items/{productId}:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
      - { $ref: '#/components/parameters/ProductId' }
    put:
      tags: [cart]
      operationId: setCartItemQuantity
      summary: Set the quantity of a product (0 removes it)
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetQuantityRequest' }
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: Remove a product from the cart
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /markets/{marketId}/cart/fulfilment:
    put:
      tags: [cart, fulfilment]
      operationId: reserveFulfilment
      summary: Reserve a delivery or pickup slot for the cart
      description: Replaces any previous reservation. The cart must not be empty (CART_EMPTY). Delivery needs an address inside the market's delivery radius.
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveFulfilmentRequest' }
      responses:
        '200':
          description: Updated cart including the reservation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
  /markets/{marketId}/slots:
    get:
      tags: [fulfilment]
      operationId: listSlots
      summary: Delivery or pickup slots of a market for the next 7 days
      description: Public for browsing. With addressId the caller must be signed in and own the address.
      security: []
      parameters:
        - { $ref: '#/components/parameters/MarketId' }
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/FulfilmentType' } }
        - { name: addressId, in: query, required: false, description: 'DELIVERY only; needs auth. Returns 422 ADDRESS_OUTSIDE_DELIVERY_AREA when outside the radius.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Slots ordered by start time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

