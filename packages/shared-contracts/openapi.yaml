        '401': { $ref: '#/components/responses/Unauthorized' }
  /markets/{marketId}/cart:
    parameters:
      - { $ref: '#/components/parameters/MarketId' }
    get:
      tags: [cart]
      operationId: getCart
      summary: The user's cart in this market (created empty if missing)
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
