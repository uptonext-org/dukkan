# Host development with `./gradlew bootRun --args='--spring.profiles.active=local'`.
logging:
  structured:
    format:
      console: ""
  level:
    de.dukkan: DEBUG

dukkan:
  security:
    # Generous limits for local development, live API tests and screenshot runs.
    rate-limit:
      logins-per-minute: 300
      registrations-per-hour: 300
      password-resets-per-hour: 300
    auth:
      # No SMTP locally: reset links are written to the log.
      log-reset-links: true
    jwt:
      # Development-only secret. Never use outside the local profile.
      secret: ${DUKKAN_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
