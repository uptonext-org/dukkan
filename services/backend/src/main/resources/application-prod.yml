# Production profile: SPRING_PROFILES_ACTIVE=prod (docs/launch/go-live.md). The startup check
# (shared.config.ProductionReadinessCheck) refuses to start with demo profiles, missing mail,
# default database credentials or app-scheme mail links.
spring:
  flyway:
    # Schema and reference data only: no invented markets, products or promotions.
    locations: classpath:db/migration
  datasource:
    # No defaults: the connection must be configured explicitly.
    url: ${DUKKAN_DB_URL}
    username: ${DUKKAN_DB_USER}
    password: ${DUKKAN_DB_PASSWORD}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # A hanging mail server must not block the outbox publisher (and the scheduled jobs after it).
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

server:
  # Behind Caddy / the ingress: client IP (rate limits per client, not per proxy), https scheme
  # (HSTS, absolute URLs) from X-Forwarded-*. Tomcat trusts only private-network proxies.
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs

dukkan:
  # Launch decisions (docs/launch/go-live.md 3.1): customers pay the market at pickup or delivery,
  # e-mail addresses are confirmed before ordering, no language model (DUKKAN_ANTHROPIC_API_KEY
  # empty: AI capture, translation and shopping lists from photos or videos are off).
  platform:
    payment: ${DUKKAN_PAYMENT:ON_SITE}
  ai:
    anthropic:
      api-key: ${DUKKAN_ANTHROPIC_API_KEY:}
  features:
    # Markets wait for an admin's review (imprint, trader identity) before they appear.
    merchant-auto-approve: ${DUKKAN_MERCHANT_AUTO_APPROVE:false}
  media:
    directory: ${DUKKAN_MEDIA_DIRECTORY:/var/lib/dukkan/media}
  privacy:
    # Own volume (infrastructure/production): never restored together with the database.
    erasure-journal: ${DUKKAN_ERASURE_JOURNAL:/var/lib/dukkan/erasures/erasures.log}
  security:
    auth:
      # https links (the web app opens them; the app via App Links / Universal Links), e.g.
      # https://dukkan.de/reset-password. Required: the app scheme does not open on a computer.
      password-reset-url: ${DUKKAN_PASSWORD_RESET_URL:}
      email-verification-url: ${DUKKAN_EMAIL_VERIFICATION_URL:}
      require-verified-email: ${DUKKAN_REQUIRE_VERIFIED_EMAIL:true}
