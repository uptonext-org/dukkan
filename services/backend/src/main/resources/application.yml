spring:
  application:
    name: dukkan-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DUKKAN_DB_URL:jdbc:postgresql://localhost:5432/dukkan}
    username: ${DUKKAN_DB_USER:dukkan}
    password: ${DUKKAN_DB_PASSWORD:dukkan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # db/demo holds the invented Hamburg markets and catalog (V3) for development, tests and demos.
    # The prod profile migrates db/migration only, so a production database never gets them.
    locations: classpath:db/migration,classpath:db/demo
  servlet:
    multipart:
      # Uploads (POST /merchant/markets/{id}/media): 5 MB per file, matching dukkan.media.max-file-size.
      # A shopping list may carry 4 photos (POST /markets/{id}/shopping-list), hence 21 MB per request.
      # Larger bodies answer 413 FILE_TOO_LARGE (ApiExceptionHandler).
      max-file-size: 5MB
      max-request-size: 21MB
      file-size-threshold: 1MB
  mvc:
    problemdetails:
      enabled: false
  autoconfigure:
    # RabbitMQ beans are created by shared.events.RabbitEventsConfiguration only when
    # dukkan.events.transport=rabbitmq, so nothing connects to a broker by default.
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.health.RabbitHealthContributorAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.metrics.RabbitMetricsAutoConfiguration

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # Read (and discard) up to this much of a rejected oversized upload so the client still gets the 413
    # instead of a reset connection.
    max-swallow-size: 16MB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  # In Kubernetes the actuator runs on its own port (MANAGEMENT_SERVER_PORT=8081, not routed by the
  # Service/Ingress); Prometheus scrapes /actuator/prometheus there. On the main port only health
  # and info are public (SecurityConfiguration).
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: dukkan-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
        dukkan.ai.requests: true
      # The Claude client times out after 30 s and retries once; keep slow calls out of +Inf.
      maximum-expected-value:
        dukkan.ai.requests: 90s
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  structured:
    format:
      console: ecs

dukkan:
  platform:
    # The operator's legal pages (https URLs; the texts are theirs). The apps link to them.
    imprint-url: ${DUKKAN_IMPRINT_URL:}
    privacy-url: ${DUKKAN_PRIVACY_URL:}
    terms-url: ${DUKKAN_TERMS_URL:}
    # Set (e.g. 2026-11) to make new accounts accept this version of terms and privacy notice.
    terms-version: ${DUKKAN_TERMS_VERSION:}
    support-email: ${DUKKAN_SUPPORT_EMAIL:}
    # SIMULATED (no payment, the apps say so) or ON_SITE (pay the market at pickup or delivery).
    payment: ${DUKKAN_PAYMENT:SIMULATED}
  features:
    # Phase 1: browsing is public; set to true to require a login for the catalog GET endpoints.
    require-login-to-browse: ${DUKKAN_REQUIRE_LOGIN_TO_BROWSE:false}
    # New merchant markets go live immediately (otherwise PENDING_REVIEW).
    merchant-auto-approve: ${DUKKAN_MERCHANT_AUTO_APPROVE:true}
  fulfilment:
    days-ahead: 7
    slot-length: PT1H
    delivery-capacity: 6
    pickup-capacity: 10
    delivery-cutoff: PT2H
    pickup-cutoff: PT1H
  catalog:
    new-listing-days: 14
    default-max-order-quantity: 24
  markets:
    default-radius-km: 10
    max-radius-km: 50
  media:
    # Filesystem storage for uploaded images (content-addressed). The docker profile uses a volume.
    directory: ${DUKKAN_MEDIA_DIRECTORY:${java.io.tmpdir}/dukkan-media}
    # Absolute URL prefix of GET /media/{key}, e.g. https://api.dukkan.app/api/v1/media or a CDN.
    # Empty: derived from each upload request (<origin>/api/v1/media).
    public-base-url: ${DUKKAN_MEDIA_PUBLIC_BASE_URL:}
    max-file-size: 5MB
    max-pixels: 40000000
    uploads-per-hour: 60
    # filesystem (default: dukkan.media.directory, one instance) or s3 (S3, R2, MinIO …; several instances).
    storage: ${DUKKAN_MEDIA_STORAGE:filesystem}
    s3:
      # Empty for AWS; e.g. https://<account>.r2.cloudflarestorage.com or http://localhost:9090.
      endpoint: ${DUKKAN_MEDIA_S3_ENDPOINT:}
      region: ${DUKKAN_MEDIA_S3_REGION:eu-central-1}
      bucket: ${DUKKAN_MEDIA_S3_BUCKET:}
      # Empty: AWS default credentials chain (env, IRSA / web identity, instance profile).
      access-key: ${DUKKAN_MEDIA_S3_ACCESS_KEY:}
      secret-key: ${DUKKAN_MEDIA_S3_SECRET_KEY:}
      path-style: ${DUKKAN_MEDIA_S3_PATH_STYLE:false}
      # Local development only.
      create-bucket: ${DUKKAN_MEDIA_S3_CREATE_BUCKET:false}
  events:
    # in-process (default: handlers run in this instance, no broker) or rabbitmq (ADR 0012).
    transport: ${DUKKAN_EVENTS_TRANSPORT:in-process}
    rabbitmq-uri: ${DUKKAN_RABBITMQ_URI:amqp://dukkan:dukkan@localhost:5672}
    publish-interval: PT1S
    # Published events and idempotency records are deleted after this (nightly job, B-37a).
    retention: P14D
  notifications:
    # Read inbox entries are deleted after this; unread ones stay (nightly job, B-37a).
    retention: P180D
  push:
    fcm:
      # Firebase Cloud Messaging HTTP v1 (Android and iOS). Empty = no push, notifications stay in the inbox.
      project-id: ${DUKKAN_FCM_PROJECT_ID:}
      # Path to the service account JSON (never commit it).
      credentials-file: ${DUKKAN_FCM_CREDENTIALS_FILE:}
  capture:
    # AI product capture: drafts per merchant and hour (each one may call the language model).
    drafts-per-hour: 30
  translation:
    # Machine translation suggestions per merchant and hour (B-38, ADR 0013).
    requests-per-hour: 60
  shopping-list:
    # Shopping lists by voice, photo or video per customer and hour (each one may call the language model).
    requests-per-hour: 20
  ai:
    # Language model for AI capture, machine translation and shopping lists (ADR 0011, 0013).
    anthropic:
      # Empty: no language model (capture and typed or spoken shopping lists use rule-based parsers,
      # translation and shopping lists from photos or videos are unavailable).
      api-key: ${DUKKAN_ANTHROPIC_API_KEY:}
      model: ${DUKKAN_ANTHROPIC_MODEL:claude-opus-5-5}
      effort: low
      # Per attempt; one retry. The app waits up to 75 s for a draft.
      timeout: PT30S
      max-tokens: 8000
      # fallbacks: "default" (beta server-side-fallback-2026-07-01): a declined request is retried
      # by the API on the model it recommends for that case.
      server-side-fallbacks: true
  security:
    # Grants ADMIN to this registered account at startup (first admin of a fresh installation).
    bootstrap-admin-email: ${DUKKAN_BOOTSTRAP_ADMIN_EMAIL:}
    jwt:
      # No default: must be provided via DUKKAN_JWT_SECRET (>= 32 bytes). Startup fails otherwise.
      secret: ${DUKKAN_JWT_SECRET:}
      # Access tokens are short-lived; the app renews them with a refresh token (POST /auth/refresh).
      ttl: ${DUKKAN_JWT_TTL:PT15M}
      issuer: dukkan
    auth:
      refresh-token-ttl: P30D
      password-reset-ttl: PT30M
      # The reset mail links here with ?token=…; the app opens dukkan://reset-password.
      password-reset-url: ${DUKKAN_PASSWORD_RESET_URL:dukkan://reset-password}
      mail-from: ${DUKKAN_MAIL_FROM:Dukkan <no-reply@dukkan.app>}
      # The welcome mail links here with ?token=… to confirm the address (B-39b).
      email-verification-url: ${DUKKAN_EMAIL_VERIFICATION_URL:dukkan://verify-email}
      email-verification-ttl: P3D
      # true: no orders and no new markets before the address is confirmed (product decision).
      require-verified-email: ${DUKKAN_REQUIRE_VERIFIED_EMAIL:false}
      # Sign in with Google / Apple: the OAuth client IDs whose ID tokens are accepted (comma separated).
      # Empty = provider disabled (422 SOCIAL_PROVIDER_DISABLED).
      google:
        client-ids: ${DUKKAN_GOOGLE_CLIENT_IDS:}
      apple:
        # The iOS bundle id (native) and/or the Services ID (web).
        client-ids: ${DUKKAN_APPLE_CLIENT_IDS:}
