spring:
  application:
    name: dukkan-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DUKKAN_DB_URL:jdbc:postgresql://localhost:5432/dukkan}
    username: ${DUKKAN_DB_USER:dukkan}
    password: ${DUKKAN_DB_PASSWORD:dukkan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  structured:
    format:
      console: ecs

dukkan:
  features:
    # Phase 1: browsing is public; set to true to require a login for the catalog GET endpoints.
    require-login-to-browse: ${DUKKAN_REQUIRE_LOGIN_TO_BROWSE:false}
    # New merchant markets go live immediately (otherwise PENDING_REVIEW).
    merchant-auto-approve: ${DUKKAN_MERCHANT_AUTO_APPROVE:true}
  fulfilment:
    days-ahead: 7
    slot-length: PT1H
    delivery-capacity: 6
    pickup-capacity: 10
    delivery-cutoff: PT2H
    pickup-cutoff: PT1H
  catalog:
    new-listing-days: 14
    default-max-order-quantity: 24
  markets:
    default-radius-km: 10
    max-radius-km: 50
  security:
    jwt:
      # No default: must be provided via DUKKAN_JWT_SECRET (>= 32 bytes). Startup fails otherwise.
      secret: ${DUKKAN_JWT_SECRET:}
      ttl: ${DUKKAN_JWT_TTL:PT1H}
      issuer: dukkan
