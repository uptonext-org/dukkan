spring:
  application:
    name: dukkan-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DUKKAN_DB_URL:jdbc:postgresql://localhost:5432/dukkan}
    username: ${DUKKAN_DB_USER:dukkan}
    password: ${DUKKAN_DB_PASSWORD:dukkan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  structured:
    format:
      console: ecs

dukkan:
  checkout:
    minimum-order-cents: 3500
  delivery:
    slot-capacity: 8
    cutoff-hour: 22
    days-ahead: 7
    first-slot-hour: 8
    last-slot-hour: 20
  security:
    jwt:
      # No default: must be provided via DUKKAN_JWT_SECRET (>= 32 bytes). Startup fails otherwise.
      secret: ${DUKKAN_JWT_SECRET:}
      ttl: ${DUKKAN_JWT_TTL:PT1H}
      issuer: dukkan
